name: Smoke IBMS V040 BIM

on:
  push:
    paths:
      - ".github/workflows/ibms-v040-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify local assets
        shell: bash
        run: |
          set -euo pipefail
          ROOT="projects/ibms-smart-park/prototype/key-screen-v0.4.0"
          test -s "$ROOT/assets/bim/Schependomlaan.gltf"
          test -s "$ROOT/assets/bim/Schependomlaan.json"
          test -s "$ROOT/vendor/three/build/three.module.js"
          ls -lh "$ROOT/assets/bim"
          google-chrome --version
          command -v chromedriver || true

      - name: Start local server
        shell: bash
        run: |
          cd projects/ibms-smart-park/prototype/key-screen-v0.4.0
          python3 -m http.server 8090 --bind 127.0.0.1 > /tmp/ibms-v040-http.log 2>&1 &
          echo $! > /tmp/ibms-v040-http.pid
          sleep 2
          curl --fail http://127.0.0.1:8090/index.html >/dev/null
          curl --fail http://127.0.0.1:8090/assets/bim/Schependomlaan.json >/dev/null
          curl --fail --range 0-1023 http://127.0.0.1:8090/assets/bim/Schependomlaan.gltf >/dev/null

      - name: Install Selenium
        run: python3 -m pip install --quiet selenium

      - name: Run BIM browser smoke test
        shell: bash
        run: |
          cat > /tmp/ibms_smoke.py <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          options = Options()
          options.binary_location = "/usr/bin/google-chrome"
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--enable-unsafe-swiftshader")
          options.add_argument("--window-size=1920,1080")
          options.set_capability("goog:loggingPrefs", {"browser":"ALL"})

          driver = webdriver.Chrome(options=options)
          try:
              driver.set_page_load_timeout(30)
              driver.get("http://127.0.0.1:8090/?bim=1&system=fire")
              wait = WebDriverWait(driver, 150)

              wait.until(lambda d: "show" in d.find_element(By.ID, "bimPanel").get_attribute("class"))
              wait.until(lambda d: d.find_element(By.ID, "bimElementCount").text not in ("", "--"))
              wait.until(lambda d: d.find_element(By.ID, "bimFloorCount").text not in ("", "--"))
              wait.until(lambda d: "消防系统" in d.find_element(By.ID, "systemSummary").text)

              element_count = driver.find_element(By.ID, "bimElementCount").text
              floor_count = driver.find_element(By.ID, "bimFloorCount").text
              summary = driver.find_element(By.ID, "systemSummary").text
              loading_class = driver.find_element(By.ID, "detailLoading").get_attribute("class")

              assert "error" not in loading_class, loading_class
              assert element_count not in ("", "--")
              assert floor_count not in ("", "--")
              assert "消防系统" in summary

              driver.save_screenshot("/tmp/ibms-v040-bim.png")
              with open("/tmp/ibms-v040-dom.html","w",encoding="utf-8") as f:
                  f.write(driver.page_source)
              with open("/tmp/ibms-v040-console.log","w",encoding="utf-8") as f:
                  for row in driver.get_log("browser"):
                      f.write(str(row)+"\n")

              print("BIM element count:", element_count)
              print("BIM floor count:", floor_count)
              print("System summary:", summary.replace("\n"," | "))
              print("IBMS v0.4.0 BIM smoke passed.")
          finally:
              driver.quit()
          PY
          python3 /tmp/ibms_smoke.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibms-v040-bim-smoke
          path: |
            /tmp/ibms-v040-bim.png
            /tmp/ibms-v040-dom.html
            /tmp/ibms-v040-console.log
            /tmp/ibms-v040-http.log
          retention-days: 3

# rerun after direct BIM smoke optimization
