name: Finalize Web Presentation V0.4.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-v0.4.1.yml'
      - 'tools/finalize_v041.py'
      - 'tools/opc-reveal-b64/**'
      - 'prototype/full-v0.4.1/**'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          if command -v google-chrome >/dev/null 2>&1; then google-chrome --version; elif command -v chromium >/dev/null 2>&1; then chromium --version; else echo 'Chrome/Chromium is required for QA rendering.' >&2; exit 1; fi
      - name: Build, audit, render and package V0.4.1
        run: python tools/finalize_v041.py
      - name: Verify generated artifacts
        run: |
          unzip -t 'release/v0.4.1/数智健康OPC国际人才社区_Web_Presentation_V0.4.1.zip'
          test -s 'qa/contact-sheet-v0.4.1.jpg'
          test -s 'prototype/full-v0.4.1/assets/opc-reveal.jpg'
          test -s 'prototype/full-v0.4.1/assets/opc-reveal.png'
          test -s 'release/v0.4.1/数智健康OPC国际人才社区_Web_Presentation_V0.4.1_Standalone.html'
          cat release/v0.4.1/SHA256SUMS.txt
      - name: Commit generated V0.4.1 artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/full-v0.4.1/assets/opc-reveal.jpg prototype/full-v0.4.1/assets/opc-reveal.png qa/contact-sheet-v0.4.1.jpg qa/source-reference-audit-v0.4.1.json qa/release-build-audit-v0.4.1.json release/v0.4.1/README.md release/v0.4.1/HTML-SHA256.txt release/v0.4.1/SHA256SUMS.txt 'release/v0.4.1/数智健康OPC国际人才社区_Web_Presentation_V0.4.1_Standalone.html' 'release/v0.4.1/数智健康OPC国际人才社区_Web_Presentation_V0.4.1.zip'
          if git diff --cached --quiet; then echo 'No generated changes to commit.'; else git commit -m 'release: finalize Web Presentation V0.4.1 artifacts'; git push origin HEAD:${GITHUB_REF_NAME}; fi
