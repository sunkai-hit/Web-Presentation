name: Build Web Presentation V0.4.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build-v0.4.1.py'
      - 'tools/v0.4.1-opc-reveal.base64.txt'
      - '.github/workflows/build-v0.4.1.yml'

permissions:
  contents: write

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build V0.4.1 multi-file and standalone outputs
        run: python tools/build-v0.4.1.py

      - name: Static JavaScript syntax checks
        run: |
          node --check prototype/full-v0.4.1/app.js
          node --check prototype/full-v0.4.1/patch-v0.4.1.js
          node --check prototype/full-v0.4.1/screens/screens-01-05.js
          node --check prototype/full-v0.4.1/screens/screens-06-10.js
          node --check prototype/full-v0.4.1/screens/screens-11-15.js
          node --check prototype/full-v0.4.1/screens/screens-16-20.js

      - name: Install browser QA dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          pip install pillow

      - name: Browser render all 20 screens
        run: |
          mkdir -p qa/v0.4.1/screenshots
          python -m http.server 8765 --directory prototype/full-v0.4.1 >/tmp/wp-http.log 2>&1 &
          echo $! > /tmp/wp-http.pid
          sleep 2
          cat > /tmp/qa-v041.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1920,height:1080},deviceScaleFactor:1});
            const errors=[];
            page.on('console',m=>{ if(m.type()==='error') errors.push('console: '+m.text()); });
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            const audit={screens:[],errors};
            for(let i=1;i<=20;i++){
              const id=String(i).padStart(2,'0');
              await page.goto(`http://127.0.0.1:8765/index.html#${id}`,{waitUntil:'networkidle'});
              await page.waitForTimeout(180);
              const data=await page.evaluate((id)=>{
                const s=document.querySelector(`.screen[data-screen="${id}"]`);
                const img=id==='02'?document.querySelector('#s02 .reveal-photo img'):null;
                return {
                  id,
                  active:!!s&&s.classList.contains('active'),
                  title:s?.querySelector('h1')?.textContent?.trim()||'',
                  stage:{w:document.getElementById('stage')?.offsetWidth,h:document.getElementById('stage')?.offsetHeight},
                  revealLoaded:img?!!(img.complete&&img.naturalWidth>0):null,
                  revealSize:img?{w:img.naturalWidth,h:img.naturalHeight}:null
                };
              },id);
              audit.screens.push(data);
              await page.screenshot({path:`qa/v0.4.1/screenshots/screen-${id}.jpg`,type:'jpeg',quality:70});
            }
            fs.writeFileSync('qa/v0.4.1/browser-audit.json',JSON.stringify(audit,null,2));
            await browser.close();
            if(errors.length) process.exitCode=2;
          })();
          NODE
          node /tmp/qa-v041.js
          kill $(cat /tmp/wp-http.pid) || true

      - name: Create 20-screen contact sheet
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          shots=[]
          for i in range(1,21):
              p=Path(f'qa/v0.4.1/screenshots/screen-{i:02d}.jpg')
              im=Image.open(p).convert('RGB')
              im.thumbnail((384,216))
              canvas=Image.new('RGB',(400,244),'white')
              canvas.paste(im,((400-im.width)//2,8))
              d=ImageDraw.Draw(canvas); d.text((12,224),f'Screen {i:02d}',fill='black')
              shots.append(canvas)
          sheet=Image.new('RGB',(400*4,244*5),(235,239,236))
          for idx,im in enumerate(shots): sheet.paste(im,((idx%4)*400,(idx//4)*244))
          sheet.save('qa/v0.4.1/contact-sheet-v0.4.1.jpg',quality=84,optimize=True)
          PY

      - name: Record checksums
        run: |
          sha256sum release/v0.4.1/数智健康OPC国际人才社区_Web_Presentation_V0.4.1_Standalone.html > release/v0.4.1/SHA256SUMS.txt
          sha256sum prototype/full-v0.4.1/assets/opc-reveal.jpg >> release/v0.4.1/SHA256SUMS.txt
          sha256sum qa/v0.4.1/contact-sheet-v0.4.1.jpg >> release/v0.4.1/SHA256SUMS.txt

      - name: Commit generated V0.4.1 artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/full-v0.4.1 release/v0.4.1 qa/v0.4.1 qa/v0.4.1-change-log.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'release: build and QA Web Presentation V0.4.1'
            git push
          fi
