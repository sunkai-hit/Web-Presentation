name: Build IBMS V040 BIM Assets

on:
  push:
    paths:
      - ".github/workflows/ibms-v040-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy existing local runtime and campus models
        shell: bash
        run: |
          set -euo pipefail
          SRC="projects/ibms-smart-park/prototype/key-screen-v0.3.2"
          DST="projects/ibms-smart-park/prototype/key-screen-v0.4.0"
          mkdir -p "$DST/assets/models" "$DST/vendor"
          cp -R "$SRC/assets/models/." "$DST/assets/models/"
          cp -R "$SRC/vendor/three" "$DST/vendor/"

      - name: Download detailed Schependomlaan BIM sample
        shell: bash
        run: |
          set -euo pipefail
          DST="projects/ibms-smart-park/prototype/key-screen-v0.4.0/assets/bim"
          mkdir -p "$DST"

          curl -L --fail --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/xeokit/examples/main/assets/models/gltf/Schependomlaan/glTF-Embedded/Schependomlaan.gltf" \
            -o "$DST/Schependomlaan.gltf"

          curl -L --fail --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/xeokit/examples/main/assets/models/gltf/Schependomlaan/Schependomlaan.json" \
            -o "$DST/Schependomlaan.json"

          curl -L --fail --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/openBIMstandards/Archive-DataSetSchependomlaan/master/LICENSE.MD" \
            -o "$DST/LICENSE-Schependomlaan.md"

          echo "Downloaded BIM assets:"
          ls -lh "$DST"

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/ibms-smart-park/prototype/key-screen-v0.4.0/assets
          git add projects/ibms-smart-park/prototype/key-screen-v0.4.0/vendor
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "assets: add detailed CC BY BIM model for IBMS v0.4.0"
          git push
