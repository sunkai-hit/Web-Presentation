name: Finalize Web Presentation

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Project config path, for example projects/opc-talent-community/web-presentation.yaml
        required: true
        default: projects/opc-talent-community/web-presentation.yaml
        type: string
      skip_layout_audit:
        description: Skip browser layout audit
        required: false
        default: false
        type: boolean
      commit_generated:
        description: Commit generated QA and release artifacts back to the current branch
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      config_path:
        required: true
        type: string
      skip_layout_audit:
        required: false
        default: false
        type: boolean
      commit_generated:
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      CONFIG_PATH: ${{ inputs.config_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install shared toolchain dependencies
        run: python -m pip install --disable-pip-version-check -r tools/web-presentation/requirements.txt

      - name: Verify input and resolve project metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          case "$CONFIG_PATH" in
            projects/*/web-presentation.yaml) ;;
            *) echo "config_path must match projects/<slug>/web-presentation.yaml" >&2; exit 2 ;;
          esac
          test -f "$CONFIG_PATH"

          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re
          import yaml

          cfg_path = Path('${{ inputs.config_path }}')
          cfg = yaml.safe_load(cfg_path.read_text(encoding='utf-8')) or {}
          root = cfg_path.parent
          slug = str(cfg.get('project_slug') or root.name)
          version = str(cfg.get('release_version') or 'unversioned')
          safe_version = re.sub(r'[^A-Za-z0-9._-]+', '-', version).strip('-')
          qa = root / str(cfg.get('qa_dir', 'qa'))
          release = root / str(cfg['release_dir'])
          standalone = release / str(cfg.get('standalone', {}).get('filename', 'Web_Presentation_Standalone.html'))
          zip_path = release / str(cfg.get('release', {}).get('zip_filename', 'Web_Presentation.zip'))
          print(f'project_root={root.as_posix()}')
          print(f'project_slug={slug}')
          print(f'version={version}')
          print(f'artifact_name={slug}-{safe_version}-release')
          print(f'qa_dir={qa.as_posix()}')
          print(f'release_dir={release.as_posix()}')
          print(f'standalone_file={standalone.as_posix()}')
          print(f'zip_file={zip_path.as_posix()}')
          PY

      - name: Verify browser availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo 'Chrome/Chromium is required for browser QA.' >&2
            exit 1
          fi

      - name: Finalize presentation
        shell: bash
        run: |
          set -euo pipefail
          args=("$CONFIG_PATH")
          if [ "${{ inputs.skip_layout_audit }}" = "true" ]; then
            args+=(--skip-layout-audit)
          fi
          python tools/web-presentation/finalize_release.py "${args[@]}"

      - name: Verify generated release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ steps.meta.outputs.standalone_file }}"
          test -s "${{ steps.meta.outputs.zip_file }}"
          test -s "${{ steps.meta.outputs.release_dir }}/SHA256SUMS.txt"
          unzip -t "${{ steps.meta.outputs.zip_file }}"
          cat "${{ steps.meta.outputs.release_dir }}/SHA256SUMS.txt"

      - name: Upload generated QA and release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            ${{ steps.meta.outputs.qa_dir }}
            ${{ steps.meta.outputs.release_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated artifacts
        if: ${{ inputs.commit_generated }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${{ steps.meta.outputs.qa_dir }}" "${{ steps.meta.outputs.release_dir }}"
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m "release: finalize ${{ steps.meta.outputs.project_slug }} ${{ steps.meta.outputs.version }}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
