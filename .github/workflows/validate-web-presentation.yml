name: Validate Web Presentations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-web-presentation.yml'
      - 'tools/web-presentation/**'
      - 'projects/**/web-presentation.yaml'
      - 'projects/**/prototype/**'
      - 'projects/**/assets/**'
  pull_request:
    paths:
      - '.github/workflows/validate-web-presentation.yml'
      - 'tools/web-presentation/**'
      - 'projects/**/web-presentation.yaml'
      - 'projects/**/prototype/**'
      - 'projects/**/assets/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install shared toolchain dependencies
        run: python -m pip install --disable-pip-version-check -r tools/web-presentation/requirements.txt

      - name: Verify browser availability
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo 'Chrome/Chromium is required for browser QA.' >&2
            exit 1
          fi

      - name: Compile shared Python tools
        run: python -m compileall -q tools/web-presentation

      - name: Discover and validate project configurations
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t configs < <(find projects -mindepth 2 -maxdepth 2 -type f -name web-presentation.yaml | sort)
          if [ "${#configs[@]}" -eq 0 ]; then
            echo 'No Web Presentation project configuration found.' >&2
            exit 1
          fi

          printf 'Discovered %s project configuration(s):\n' "${#configs[@]}"
          printf ' - %s\n' "${configs[@]}"

          for config in "${configs[@]}"; do
            echo "::group::Validate ${config}"
            python tools/web-presentation/audit_source.py "$config"
            python tools/web-presentation/validate_assets.py "$config"
            python tools/web-presentation/audit_layout.py "$config"
            echo "::endgroup::"
          done

      - name: Upload QA audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-presentation-validation-${{ github.run_id }}
          path: |
            projects/**/qa/*audit*.json
          if-no-files-found: warn
          retention-days: 14
