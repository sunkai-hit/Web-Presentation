<style>

to;background:#17213a;color:white;border-radius:16px;padding:12px 15px;text-align:center;font-weight:760;font-size:16px;line-height:1.45}.tagrow{display:flex;flex-wrap:wrap;gap:8px}.tag{background:white;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:#42516b;font-size:12px;font-weight:750}.path{display:flex;flex-direction:column;gap:8px}.path div{display:flex;justify-content:space-between;background:white;border:1px solid var(--line);border-radius:14px;padding:10px 12px}.bookrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.bookrow span{height:76px;border-radius:10px;background:var(--blue);color:white;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:800}.bookrow span:nth-child(2){background:var(--green)}.bookrow span:nth-child(3){background:var(--gold)}.bookrow span:nth-child(4){background:var(--red)}.chapter{background:white;border:1px solid var(--line);border-radius:14px;padding:10px}.chapter b{display:block;color:var(--blue);font-size:14px;margin-bottom:5px}.chapter p{font-size:12.5px;line-height:1.38;color:#455168}.node{background:white;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column}.node b{font-size:15px;color:var(--blue);margin-bottom:7px}.node p{font-size:13px;line-height:1.42;color:#445064}.node em{font-style:normal;margin-top:auto;border-top:1px dashed rgba(184,138,67,.4);padding-top:6px;color:#6b5d4b;font-size:12px}.flow{display:flex;gap:8px;align-items:stretch}.flow .node{flex:1}.arrow{display:flex;align-items:center;color:var(--gold);font-weight:900}.bigquote{font-size:32px;line-height:1.5;color:var(--blue);font-weight:850;text-align:center}.center{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.progress{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);height:4px;width:min(920px,72vw);background:rgba(23,33,58,.12);border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--blue))}.nav{position:fixed;right:16px;bottom:18px;display:flex;gap:8px}.nav button{background:rgba(23,33,58,.9);color:white;border:0;border-radius:999px;padding:10px 14px;font-weight:700}@media(max-width:1100px){.slide{padding:22px 26px 40px}.title{font-size:28px}.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}.bigquote{font-size:25px}}

<script>
const slides=[
{t:'从“显化”到习惯',k:'四本书，四种解释',s:'愿望是怎么影响现实的？',type:'cover',blocks:['从 4 本书，看一个想法怎样经过想象、障碍、行动、习惯与身份，最终影响人的生活轨迹。','✨ 愿望 → 🧱 障碍 → ⚙️ 行动 → 🔁 习惯 → 📖 身份','Manifestation · Mental Contrasting · Habit Science · Narrative Identity'],take:'这不是“如何成功”的课，而是研究一个愿望怎样一步步进入现实。'},
{t:'一个流行词：Manifestation 到底是什么？',k:'从一个流行词开始',s:'先拆开看：它包含哪些东西，又可能被怎样理解？',g:'g3',blocks:[['今天网上常见的“显化”','Visualization：想象未来场景。Affirmation：反复肯定语。Law of Attraction：吸引力法则。Assume it is done：假设已经实现。'],['三种解释','玄学版：思想直接吸引现实。心理学版：思想改变注意力、期待和解释方式。行为科学版：心理变化必须进入行动与环境。'],['真正的问题','一个愿望到底通过哪些中间环节影响现实？愿望不是结果本身，而是可能改变注意力、选择和行动的起点。']],take:'不急着问“显化是真是假”，而问：一个愿望怎样影响现实？'},
{t:'为什么是这四本书？',k:'知识地图',s:'四本书像四个焦距不同的镜头。',g:'g4',blocks:[['📘 Shinn｜内在图景','如果嘴上想成功，心里却一直预演失败，会怎样？贡献：先让未来在脑中有位置。'],['📗 Oettingen｜现实障碍','为什么只幻想成功，有时反而不行动？贡献：愿景必须碰到现实。'],['📙 Wood｜自动行为','为什么目标变了，行为还停在过去？贡献：改变行为，要改变情境。'],['📕 McAdams｜自我故事','一次失败为什么会变成“我就是不行”？贡献：经历最终进入身份故事。']],take:'未来图景 → 现实障碍 → 行为系统 → 真实证据 → 自我故事。'},
{t:'Florence Scovel Shinn 是谁？',k:'第一本书 · 作者背景',s:'一百年前的人，为什么已经在讨论语言、潜意识和显化？',g:'g3',blocks:[['人物与时代','Florence Scovel Shinn（1871–1940），艺术家、插画家、作家、spiritual teacher。代表作出版于 1925 年。'],['New Thought 背景','这个传统把宗教、潜意识、自我暗示、积极思考、丰盛观念混合在一起。它不是现代实验心理学论文。'],['她真正关心的问题','人想要的东西，和每天在心理上重复的东西，经常相反：想改变，却反复说不可能；想丰盛，却每天害怕缺少。']],take:'她想让人的语言、想象、期待与真正想去的方向一致。'},
{t:'《The Game of Life》十章，不是十个金句',k:'章节地图',s:'它覆盖金钱、语言、恐惧、关系、宽恕、直觉、人生方向和自我暗示。',type:'chapters',take:'这本书讨论的是：人如何从恐惧和匮乏，转向更开放、更愿意行动的状态。'},
{t:'Shinn 的完整机制：愿望如何走向现实？',k:'第一本书 · 核心机制',s:'内在系统进入现实系统。',type:'nodes8',take:'Shinn 说思想有显现力量；现代解释是心理图景通过注意力、行为和机会识别间接影响结果。'},
{t:'故事一：新公寓和新地毯',k:'Shinn 的故事',s:'为什么 Shinn 总要求人先准备，而不是只想象？',g:'g2',blocks:[['故事过程','住房紧缺 → 女士担心找不到 → 先买适合新家的地毯 → 后来出现住房机会。'],['两层解释','Shinn：相信结果，所以做出准备动作。现代解释：地毯不会召唤房子，但准备行为会让人从“没有可能”变成“我正在准备”。']],take:'显化有价值的部分不是幻想，而是让人开始做出与未来一致的准备。'},
{t:'故事二：急需 3000 美元',k:'Shinn 的故事',s:'目标可以明确，但实现路径不要锁死。',g:'g2',blocks:[['故事背景','某女士急需一笔钱，焦虑让她不断问：到底谁能给我这 3000 美元？这个问题已把答案锁死在某个人和某种方式上。'],['开放路径','错误路径：必须 A 借给我。开放路径：退款、工作机会、项目、亲友帮助、其他资源。路径锁得越死，越容易看不到替代资源。']],take:'明确结果，不执着实现路径。'},
{t:'故事三：语言如何变成预期？',k:'语言的力量',s:'“我总是赶不上车”只是一句话吗？',g:'g2',blocks:[['语言机制','语言 → 预期 → 情绪 → 行动 → 证据选择。反复说“我每次都会搞砸”，会让人提前进入失败预期。'],['事实 vs 身份','“我昨天没赶上车”是事实；“我总是赶不上”已经把一次事件升级成命运或身份。']],take:'语言最危险的地方，是把临时状态说成固定身份。'},
{t:'故事四：目标清楚，但方案保持弹性',k:'Shinn 的方法边界',s:'三个短故事压成一个现实原则。',g:'g3',blocks:[['贫穷的人','表面上“贫穷”的人，也可能成为资源、联系或机会的中介。不要只按标签判断。'],['钢琴的流动','想要新钢琴时，旧钢琴未必是障碍；资源可能通过交换、租用、转移重新流动。'],['这个或更好的','不要把某个人、某件物、某条路径当作唯一答案。目标清楚，方案保持弹性。']],take:'开放路径不是降低目标，而是承认现实比想象的路径更多。'},
{t:'关系、直觉和“明确线索”',k:'Shinn 不只讲钱',s:'第一本书里还有关系、爱、直觉和下一步。',g:'g2',blocks:[['关系：爱不是控制','Shinn 反对用恐惧控制别人。嫉妒、占有、害怕失去，常常伪装成“爱”。'],['直觉：找下一步','她常说请求明确指引。现代翻译是：在信息不完整时，先找到一个可验证的小动作。']],take:'直觉不是替代理性，而是把模糊焦虑缩小成可验证的下一步。'},
{t:'第一本书：留下什么，丢掉什么？',k:'小结与边界',s:'这本书有力量，但不能全部按字面相信。',g:'g2',blocks:[['值得保留','未来图景、语言意识、开放路径、行动前准备、做完可控部分后放下焦虑、注意下一步线索。'],['需要谨慎','思想直接控制疾病和灾难、失败者因为信念不够、肯定语替代行动、用显化控制他人。']],take:'转折：积极想象真的一定会让人更努力吗？'},
{t:'Oettingen 为什么重新思考积极思考？',k:'第二本书',s:'美好幻想会让人感觉更好，但未必让人行动更多。',g:'g2',blocks:[['一个普通场景','学生反复想象自己进入前十：老师表扬、父母开心、自己轻松。问题是：想象之后，真实行为有没有改变？'],['她的追问','如果美好幻想让人提前获得心理满足，会不会反而降低“我得做点什么”的紧迫感？她不是反对梦想，而是反对用梦想替代现实接触。']],take:'未来图景负责方向，但如果不碰到现实，它也可能只是舒服的幻想。'},
{t:'Mental Contrasting：未来为什么必须和现实放在一起？',k:'心理对照',s:'只有未来会变成幻想；只有现实会变成焦虑。两者相遇，才产生行动张力。',g:'g3',blocks:[['未来','三个月后体力更好。'],['当前现实','下班回家第一反应是躺下刷手机。'],['真正障碍','不是“不想运动”，而是疲劳时没有备用动作。']],take:'障碍不是负能量，障碍是信息。'},
{t:'WOOP 四步：四个心理任务',k:'方法图',s:'WOOP 的重点不是让你一直有动力，而是让障碍出现时你知道下一步。',type:'woop',take:'WOOP 把“我要更努力”换成“障碍出现时我具体做什么”。'},
{t:'WOOP 完整案例：学习、运动、项目',k:'应用页',s:'把最容易失败的瞬间提前设计。',g:'g3',blocks:[['学习：卡题怎么办？','Wish：难题多坚持一会。Obstacle：卡住就想看答案。Plan：先重写已知条件和目标。'],['运动：下班太累怎么办？','Wish：每周运动三次。Obstacle：回家就想躺下。Plan：先换衣服走 10 分钟。'],['项目：总换想法怎么办？','Wish：完成 MVP。Obstacle：遇到难点就换方向。Plan：新想法先记入列表，当前版本完成前不切换。']],take:'关键不是更有动力，而是提前设计“失败瞬间”的替代动作。'},
{t:'WOOP 也可以帮助人放弃不值得的目标',k:'成熟的目标管理',s:'不是所有愿望都应该被坚持到最后。',g:'g2',blocks:[['目标可行时','心理对照会增强投入：未来有吸引力，障碍也清楚，于是行动更具体。'],['目标不现实时','它也可能帮人降低投入、缩小目标或转向其他方向。放下也可能是成熟。']],take:'成熟的目标管理包括：开始、调整、暂停和放下。'},
{t:'这套方法有没有研究支持？',k:'研究证据',s:'心理学方法需要实验，不只是听起来合理。',g:'g3',blocks:[['MCII 是什么？','Mental Contrasting + Implementation Intentions：心理对照加执行意图。'],['研究结论','曾有元分析纳入 24 个独立研究、约 15,907 名参与者，整体效果约小到中等（Hedges g≈0.34）。'],['保持克制','它不是魔法；效果受目标可行性、实施质量、场景影响。']],take:'有研究支持，不等于万能有效。'},
{t:'Wendy Wood：为什么“知道”经常输给“习惯”？',k:'第三本书',s:'目标已经更新到 V2.0，行为系统可能仍运行 V1.0。',g:'g2',blocks:[['目标系统','问的是：我今天想做什么？需要意识、判断和选择，也容易受疲劳和情绪影响。'],['习惯系统','问的是：我以前在这种场景下通常做什么？它更快、更省力，也更容易自动接管。']],take:'很多时候，中间没有一次完整的“我要不要玩手机？”'},
{t:'电影院的陈爆米花实验',k:'经典实验',s:'为什么不好吃也会继续吃？因为熟悉情境可以直接触发行为。',g:'g2',blocks:[['实验过程','电影院里给观众爆米花，其中有新鲜也有不新鲜；观察强习惯者和弱习惯者的吃法。'],['实验结果','弱习惯者不好吃就少吃；强习惯者在熟悉电影院情境中，即使不好吃仍更容易继续吃。']],take:'有时候不是“我选择了”，而是场景替我启动了旧行为。'},
{t:'习惯是怎么形成的？',k:'习惯机制图',s:'习惯不是 21 天魔法，而是稳定情境中的反复学习。',type:'habit',take:'坏习惯常赢在即时奖励，好习惯需要设计即时反馈。'},
{t:'摩擦力：比“我要更自律”更有用的问题',k:'环境设计',s:'环境不是背景板，环境一直在递给你下一步动作。',g:'g3',blocks:[['降低好行为摩擦','书提前翻开、鞋放门口、第一步缩到 5 分钟、固定时间地点、完成后可见进度。'],['增加坏行为摩擦','手机离开工作区、关闭通知、退出账号、零食移出视线、游戏入口多一步。'],['拖延为什么会被奖励？','逃开难题会让焦虑立刻下降。于是大脑学到：逃避 → 短期舒服。']],take:'不要只改意志力，也要改摩擦力。'},
{t:'环境变化为什么是改变习惯的好时机？',k:'Habit Discontinuity',s:'旧习惯依赖稳定线索。环境一变，旧自动化会短暂失效。',g:'g2',blocks:[['旧链条','一回家 → 躺床 → 手机 → 视频。这个链条强，是因为地点、动作和奖励长期绑定。'],['新窗口','搬家、换学校、换工位、换作息，会打断原有线索，也提供建立新链条的机会。']],take:'环境改变虽然麻烦，但它也让旧自动化暂时失效。'},
{t:'McAdams：人不仅经历人生，还会把人生讲成故事',k:'第四本书',s:'事实相近，意义不同，下一步也不同。',g:'g2',blocks:[['Narrative Identity','成年人会把过去经历、现在处境和未来想象组织成一个关于“我是谁”的故事。'],['同一失败，两种故事','项目失败可以被讲成“我不适合”，也可以被讲成“我暴露了销售和现金流能力不足”。']],take:'人生活的不只是发生过的事情，也生活在“这些事情说明了什么”里。'},
{t:'人生故事由什么组成？',k:'叙事身份结构',s:'人生故事像剪辑台：决定哪些镜头被反复播放。',g:'g5',blocks:[['叙事基调','世界总体安全还是危险？好事能否持续？'],['关键场景','高峰、低谷、转折、早期记忆。'],['Agency','我能不能影响生活、做出选择？'],['Communion','我和别人如何连接？爱、友谊、归属。'],['价值背景','自由、责任、家庭、创造、成就、稳定。']],take:'身份不是一句标签，而是由场景、价值、关系和解释共同编成的故事。'},
{t:'一个小场景如何变成身份？',k:'叙事链条',s:'故事塑造行为，行为又会提供新证据。',g:'g5',blocks:[['事件','课堂答错，被同学笑。'],['情绪','羞耻，觉得自己暴露了。'],['解释','公开表达很危险。'],['身份','我不是善于表达的人。'],['行为','避免举手，练习减少。']],take:'另一种解释：那次经历很难受，但不等于我永久不适合表达。'},
{t:'Redemption 和 Contamination',k:'两种故事结构',s:'同一段人生，可以被组织成完全不同的结构。',g:'g2',blocks:[['Redemption｜救赎叙事','坏事仍然是坏事，但后来从中发展出能力、关系或方向。例如：项目失败 → 学会商业验证。'],['Contamination｜污染叙事','一次坏事把后面所有好事都染黑。例如：项目失败 → 我的人生总会失败。']],take:'健康的救赎叙事不是“坏事都是好事”，而是后来做出了新的发展。'},
{t:'从事实到身份，中间有两层我们经常跳过',k:'拆解图',s:'“我是这样的人”很难改；“我有这样一种模式”就可以设计。',g:'g3',blocks:[['数学失分','过快解释：我就是粗心。更完整解释：检查流程还未形成习惯。'],['项目中断','过快解释：我没执行力。更完整解释：范围过大，缺少阶段反馈。'],['表达卡壳','过快解释：我不适合表达。更完整解释：练习情境太少。']],take:'重写故事不是改事实，而是不改变事实，改变因果解释。'},
{t:'Generativity：成长最后不只是我得到什么',k:'更成熟的问题',s:'如果我拥有了这些能力，它们最后要服务什么？',g:'g2',blocks:[['从获得到创造','McAdams 很重视成年期 generativity：人会开始关心自己能为下一代、学生、家庭、组织留下些什么。'],['例子','教会别人一项能力、养育孩子、做一个有用产品、写一本书、建立一个长期团队。']],take:'愿望从“我要得到什么”，升级为“我能创造什么”。'},
{t:'四本书合起来：一个循环，而不是一条直线',k:'总模型',s:'稳定改变不是先相信自己已经是某种人，而是允许新可能、行动、获得证据、更新故事。',g:'g4',blocks:[['未来图景','我想去哪里？'],['现实对照','什么挡着我？'],['If–Then','障碍出现时做什么？'],['环境设计','怎样让正确行为更容易？'],['重复与习惯','怎样让行动自动化？'],['真实证据','我真的做到了什么？'],['身份更新','这些证据说明我正在成为谁？'],['新未来图景','进入下一轮循环。']],take:'这是循环，不是一次性直线。'},
{t:'成人案例：我想独立完成一个产品',k:'完整案例',s:'成年人同样需要这套模型。',g:'g3',blocks:[['Shinn + Oettingen','未来图景：能独立完成并上线真实产品。障碍：遇到难点就切换新想法。'],['WOOP + Wood','如果卡住，就缩小范围而不是换项目。固定环境，第一步小于 5 分钟，手机远离。'],['McAdams','旧故事：多年没开发，已经不是能独立开发的人。新故事：我是在重建端到端能力。']],take:'未来图景只有落到障碍、计划、环境和真实证据上，才会真正变成现实变化。'},
{t:'学生案例：“我数学就是不行”到底发生了什么？',k:'完整案例',s:'这不是鸡汤，而是把身份判断拆回行为机制。',g:'g4',blocks:[['未来图景','遇到难题不慌。'],['现实障碍','卡 3 分钟就想看答案。'],['If–Then','如果卡住，先写已知条件和目标。'],['环境','答案册放远，草稿纸在手边。'],['重复','同类题固定使用同一步骤。'],['证据','一周有 6 道题是自己坚持做出来的。'],['身份更新','也许不是数学不行，而是过去太早退出。']],take:'身份判断要拆回具体行为机制。'},
{t:'所以“显化”到底是什么？',k:'最终区分',s:'去唯心化以后，它变成一条关于心理、行为、环境和身份的现实链。',g:'g3',blocks:[['玄学版','思想直接召唤现实。最吸引人，也最缺少可验证机制。'],['简单励志版','相信 + 努力就行。比玄学现实，但低估环境、习惯和身份故事。'],['整合版','未来图景改变注意力与期待；现实对照识别障碍；计划与环境改变行为；重复形成习惯；真实证据更新身份。']],take:'能改变现实的不是愿望本身，而是愿望进入行为系统后的连锁反应。'},
{t:'结尾',k:'最后留下什么？',s:'',end:true,quote:'也许愿望不会直接改变世界，但它会改变你看见什么、怎样解释、愿意尝试什么，以及重复什么。而这些变化持续足够久以后，现实真的可能开始不同。',blocks:[['Shinn','先看见未来。'],['Oettingen','再看清障碍。'],['Wood','让正确行为变容易。'],['McAdams','用真实证据更新故事。']]}
];
const chapters=['🎲 01 游戏|重新定义人生：不是战场，而是有规则的互动。','🌾 02 丰盛|匮乏感会改变选择和行动。','🗣 03 语言|反复语言会变成默认预期。','🌊 04 不抗拒|把注意力从恐惧转向想创造什么。','🕊 05 宽恕|释放被过去占用的心理资源。','🎒 06 卸下重担|区分行动和焦虑。','❤️ 07 爱|关系不以控制为前提。','🧭 08 指引|把焦虑变成可验证动作。','🧩 09 神圣设计|寻找适合自己的位置。','🔄 10 肯定语|改变默认心理脚本。'];
const nodes8=['🎯 愿望|把“我想变好”变成具体状态。|例：遇到难题时不立刻放弃。','🖼 想象|建立终点画面，不只盯着“还没做到”。|例：平静读完一篇英文文章。','🗣 语言|停止每天把目标撤销。|例：“没坚持”和“坚持不了”不同。','🧠 期待|反复语言形成默认预测。|例：预测失败会让人更早退出。','🧘 放下|别把焦虑误认为行动。|例：发完申请后不再反复检查结果。','🔎 指引|把不知道怎么办缩小成下一步。|例：联系、查询、做最小版本。','🚶 行动|信念必须进入行为才进入现实系统。|例：报名、联系、尝试、开始。','🌍 反馈|结果反过来塑造语言与身份。|例：12 次运动是现实证据。'];
const woop=['🎯 W｜Wish|确定有意义、有挑战、基本可行的愿望。|例：每周稳定读三次英文短文。','🌟 O｜Outcome|想象最好的结果，确认为什么值得。|例：读题不那么慌。','🧱 O｜Obstacle|找到内部障碍，不停在没时间。|例：一看到生词多就想逃。','🪜 P｜Plan|If X, then Y，把障碍和动作绑定。|例：先读第一段并标 3 个词。'];
const habit=['📍 情境|稳定时间、地点和前置动作。|晚饭后坐到书桌前。','⚙️ 行为|动作越小，越容易开始。|先做 10 分钟题。','🎁 奖励|即时奖励更容易被大脑学习。|完成感、放松、新鲜感。','🔁 重复|相同线索下反复发生。|每天同一时间开始。','🚀 自动化|最后不再每次重新说服自己。|到点自然开始。'];
function card(pair,i){return `<div class="card ${['gold','blue','green','red'][i%4]}"><h3>${pair[0]}</h3><p>${pair[1]}</p></div>`}
function node(txt){let [a,b,c]=txt.split('|');return `<div class="node"><b>${a}</b><p>${b}</p>${c?`<em>${c}</em>`:''}</div>`}
function render(s,i){if(s.end)return `<section class="slide"><div class="center"><div class="top"><div class="kicker">${s.k}</div><div class="page">${i+1} / ${slides.length}</div></div><div class="bigquote">${s.quote}</div><div class="grid g4" style="margin-top:28px">${s.blocks.map(card).join('')}</div></div></section>`;let body='';if(s.type==='cover')body=`<div class="grid g2"><div><h1 style="font-size:56px;color:var(--blue)">${s.t}</h1><p class="sub" style="font-size:24px">${s.s}</p><p style="font-size:17px;line-height:1.6;margin-top:16px">${s.blocks[0]}</p><div class="tagrow" style="margin-top:16px">${s.blocks[2].split(' · ').map(x=>`<span class="tag">${x}</span>`).join('')}</div></div><div><div class="path">${s.blocks[1].split(' → ').map(x=>`<div><b>${x}</b><span>下一步</span></div>`).join('')}</div><div class="bookrow"><span>Game of Life</span><span>WOOP</span><span>Good Habits</span><span>Life Stories</span></div></div></div><div class="take">${s.take}</div>`;else if(s.type==='chapters')body=`<div class="grid g5">${chapters.map(x=>{let [a,b]=x.split('|');return `<div class="chapter"><b>${a}</b><p>${b}</p></div>`}).join('')}</div><div class="take">${s.take}</div>`;else if(s.type==='nodes8')body=`<div class="grid g4">${nodes8.map(node).join('')}</div><div class="take">${s.take}</div>`;else if(s.type==='woop')body=`<div class="grid g4">${woop.map(node).join('')}</div><div class="take">${s.take}</div>`;else if(s.type==='habit')body=`<div class="grid g5">${habit.map(node).join('')}</div><div class="take">${s.take}</div>`;else body=`<div class="grid ${s.g||'g2'}">${s.blocks.map(card).join('')}</div><div class="take">${s.take}</div>`;return `<section class="slide ${i===0?'active':''}"><div class="top"><div class="kicker">${s.k}</div><div class="page">${i+1} / ${slides.length}</div></div><h2 class="title">${s.t}</h2>${s.s?`<p class="sub">${s.s}</p>`:''}<div class="body">${body}</div></section>`}
document.getElementById('deck').innerHTML=slides.map(render).join('');
const els=[...document.querySelectorAll('.slide')];let current=0;function show(i){current=Math.max(0,Math.min(els.length-1,i));els.forEach((s,idx)=>s.classList.toggle('active',idx===current));document.getElementById('bar').style.width=((current+1)/els.length*100)+'%';location.hash='s'+(current+1)}function fromHash(){const m=location.hash.match(/s(\d+)/);if(m)show(parseInt(m[1])-1);else show(0)}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}});fromHash();
</script>
</body>
