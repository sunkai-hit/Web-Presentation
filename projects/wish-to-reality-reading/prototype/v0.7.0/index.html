<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>从“显化”到习惯 v0.7.0</title>
<style>
:root{--bg:#f2eadf;--paper:#fffaf5;--ink:#17233b;--muted:#5b6677;--blue:#183c70;--gold:#b88745;--line:#dac8ad;--warm:#f6ead0;--bluebg:#e9f0fb;--greenbg:#e9f2ec;--redbg:#f7e7e5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#fff8ee 0,#f2eadf 46%,#e5d7c2 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden}.deck{height:100vh;display:flex;align-items:center;justify-content:center;padding:2vh 1.5vw}.slide{display:none;width:min(96vw,152vh);height:min(54vw,86vh);aspect-ratio:16/9;background:linear-gradient(160deg,#fffdf8,#fbf3e8);border:1px solid rgba(184,136,68,.28);border-radius:30px;box-shadow:0 20px 55px rgba(49,43,33,.16);padding:30px 38px 36px;overflow:hidden}.slide.active{display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.eyebrow{font-size:13px;font-weight:850;color:var(--gold);letter-spacing:.06em}.page{font-size:12px;color:#8c7a62;font-weight:800}h1{font-size:31px;line-height:1.15;margin:0 0 12px;color:var(--blue);letter-spacing:-.02em}.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}.grid.two{grid-template-columns:repeat(2,1fr)}.grid.four{grid-template-columns:repeat(4,1fr)}.card{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:17px;padding:13px 15px;box-shadow:0 7px 20px rgba(50,40,27,.05);font-size:13.7px;line-height:1.45}.card:nth-child(3n+1){background:var(--warm)}.card:nth-child(3n+2){background:var(--bluebg)}.card:nth-child(3n){background:var(--greenbg)}.card b{display:block;color:var(--blue);font-size:15px;margin-bottom:5px}.card p{margin:0}.note{background:#17233b;color:white;border-radius:16px;padding:11px 16px;font-weight:760;text-align:center;font-size:14.5px;line-height:1.45;margin-top:12px}.chain{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}.chain span{background:white;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:800;color:var(--blue);font-size:13px}.chain b{color:var(--gold);font-size:22px}.controls{position:fixed;right:20px;bottom:18px;display:flex;gap:8px;z-index:10}.controls button{border:0;background:#17233b;color:white;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}.progress{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(900px,72vw);height:4px;border-radius:999px;background:rgba(22,35,59,.16);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--blue));transition:.25s}.loading{font-size:22px;color:var(--blue);font-weight:800}.small{font-size:12.5px;color:var(--muted)}@media(max-width:1000px){h1{font-size:24px}.slide{padding:24px 28px 34px}.grid,.grid.two,.grid.four{grid-template-columns:1fr 1fr}.controls{display:none}}
</style>
</head>
<body>
<div class="deck" id="deck"><div class="loading">正在加载 v0.7.0 内容稿…</div></div>
<div class="progress"><div class="bar"></div></div>
<div class="controls"><button id="prev">← 上一页</button><button id="next">下一页 →</button></div>
<script>
const localPath='../../spec/v0.7.0-full-page-content.md';
const rawPath='https://raw.githubusercontent.com/sunkai-hit/Web-Presentation/main/projects/wish-to-reality-reading/spec/v0.7.0-full-page-content.md';
let slides=[],current=0;
function esc(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function splitCards(text){
  const parts=text.split(/(?=(?:[\u2460-\u2473]|\d+\.|[-•]|[📘📗📙📕🎯🖼🗣🧠🧘🔎🚶🌍🏚😟🛍🏠🌟🧱🪜📍⚙️🎁🔁🚀📷💬🪞✨]\s))/).map(s=>s.trim()).filter(Boolean);
  if(parts.length>=4) return parts;
  return text.split(/。(?=\S)/).map(s=>s.trim()).filter(Boolean).map(s=>s.endsWith('。')?s:s+'。');
}
function parse(md){
  const sections=[...md.matchAll(/^## 第\s*(\d+)\s*页｜(.+?)\n([\s\S]*?)(?=^## 第\s*\d+\s*页｜|\s*$)/gm)];
  return sections.map(m=>{
    let content=m[3].trim();
    let eyebrow='';
    content=content.replace(/\*\*页面定位：\*\*\s*([^\n]+)\n?/,(x,a)=>{eyebrow=a.trim();return ''});
    let note='';
    content=content.replace(/\*\*页底收束：\*\*\s*([\s\S]*)$/,(x,a)=>{note=a.trim();return ''});
    content=content.replace(/\*\*/g,'');
    return {no:+m[1],title:m[2].trim(),eyebrow,content:content.trim(),note};
  });
}
function renderSlide(s,total){
  const cards=splitCards(s.content).slice(0,12);
  const klass=cards.length<=4?'grid two':cards.length>=8?'grid four':'grid';
  let html='<section class="slide" data-slide="'+s.no+'"><div class="head"><div class="eyebrow">'+esc(s.eyebrow||'读书讲义')+'</div><div class="page">'+s.no+' / '+total+'</div></div><h1>'+esc(s.title)+'</h1><div class="body"><div class="'+klass+'">';
  html+=cards.map((c,i)=>{
    const t=c.replace(/^[-•]\s*/,'').trim();
    const pieces=t.split(/[:：]/);
    if(pieces.length>1 && pieces[0].length<22){return '<div class="card"><b>'+esc(pieces.shift())+'</b><p>'+esc(pieces.join('：'))+'</p></div>'}
    return '<div class="card"><p>'+esc(t)+'</p></div>'
  }).join('');
  html+='</div>';
  if(s.content.includes('→')) html+='<div class="chain">'+esc((s.content.match(/[^\n。]*→[^\n。]*/)||[''])[0]).split('→').filter(Boolean).map(x=>'<span>'+x.trim()+'</span>').join('<b>→</b>')+'</div>';
  html+='</div>'+(s.note?'<div class="note">'+esc(s.note)+'</div>':'')+'</section>';
  return html;
}
function show(i){current=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.slide').forEach((s,idx)=>s.classList.toggle('active',idx===current));document.querySelector('.bar').style.width=((current+1)/slides.length*100)+'%';history.replaceState(null,'','#s'+(current+1))}
function fromHash(){const m=location.hash.match(/s(\d+)/);show(m?parseInt(m[1])-1:0)}
async function load(){
  let text='';
  try{ text=await fetch(localPath).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}); }
  catch(e){ text=await fetch(rawPath).then(r=>r.text()); }
  slides=parse(text);
  document.getElementById('deck').innerHTML=slides.map(s=>renderSlide(s,slides.length)).join('');
  fromHash();
}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
window.addEventListener('hashchange',fromHash);load();
</script>
</body>
</html>
