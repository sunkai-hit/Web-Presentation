<title>从“显化”到习惯 v0.7.0</title>
<style>
:root{--bg:#f2eadf;--paper:#fffaf5;--ink:#17233b;--muted:#5b6677;--blue:#183c70;--gold:#b88745;--line:#dac8ad;--warm:#f6ead0;--bluebg:#e9f0fb;--greenbg:#e9f2ec;--redbg:#f7e7e5;--dark:#17233b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#fff8ee 0,#f2eadf 46%,#e5d7c2 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);overflow:hidden}.deck{height:100vh;display:flex;align-items:center;justify-content:center;padding:2vh 1.5vw}.slide{display:none;width:min(96vw,152vh);height:min(54vw,86vh);aspect-ratio:16/9;background:linear-gradient(160deg,#fffdf8,#fbf3e8);border:1px solid rgba(184,136,68,.28);border-radius:30px;box-shadow:0 20px 55px rgba(49,43,33,.16);padding:30px 38px 38px;overflow:hidden}.slide.active{display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.eyebrow{font-size:13px;font-weight:850;color:var(--gold);letter-spacing:.06em}.page{font-size:12px;color:#8c7a62;font-weight:800}h1{font-size:31px;line-height:1.15;margin:0 0 12px;color:var(--blue);letter-spacing:-.02em}.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}.grid.two{grid-template-columns:repeat(2,1fr)}.grid.four{grid-template-columns:repeat(4,1fr)}.card{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:17px;padding:13px 15px;box-shadow:0 7px 20px rgba(50,40,27,.05);font-size:13.7px;line-height:1.45}.card:nth-child(3n+1){background:var(--warm)}.card:nth-child(3n+2){background:var(--bluebg)}.card:nth-child(3n){background:var(--greenbg)}.card b{display:block;color:var(--blue);font-size:15px;margin-bottom:5px}.note{background:#17233b;color:white;border-radius:16px;padding:11px 16px;font-weight:760;text-align:center;font-size:14.5px;line-height:1.45;margin-top:12px}.chain{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}.chain span{background:white;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:800;color:var(--blue);font-size:13px}.chain b{color:var(--gold);font-size:22px}.controls{position:fixed;right:20px;bottom:18px;display:flex;gap:8px;z-index:10}.controls button{border:0;background:#17233b;color:white;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}.progress{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(900px,72vw);height:4px;border-radius:999px;background:rgba(22,35,59,.16);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--blue));transition:.25s}@media(max-width:1000px){h1{font-size:24px}.slide{padding:24px 28px 34px}.grid,.grid.two,.grid.four{grid-template-columns:1fr 1fr}.controls{display:none}}

<script>
const slides=[
{e:'四本书，四种解释',t:'从“显化”到习惯',c:['愿望是怎么影响现实的？从 4 本书，看一个想法怎样经过想象、障碍、行动、习惯与身份，最终影响人的生活轨迹。','✨ 我想成为怎样？ → 🧱 现实卡在哪里？ → ⚙️ 我真正做了什么？ → 🔁 什么开始变成习惯？ → 📖 最后我怎样解释“我是谁”？','关键词：Manifestation、Mental Contrasting、Habit Science、Narrative Identity。'],n:'这不是“如何成功”的课，而是研究一个看不见的愿望，怎样一步步进入看得见的现实。'},
{e:'概念起点',t:'Manifestation：一个流行、也很容易被误解的词',c:['网上常见说法：想象已经拥有它、相信它已经发生、你的思想会吸引与你频率相同的现实。相关关键词包括 visualization、affirmation、law of attraction、assume it is done。','玄学版本：思想本身会吸引现实。心理学版本：思想改变注意力、期待和解释方式。行为科学版本：心理变化只有进入计划、行动、环境和习惯，才可能稳定改变现实。','例子：当一个人真正决定找新工作，他可能突然注意到更多招聘信息。信息不一定变多了，变化的可能是他的注意力筛选标准。'],n:'不急着问“显化真假”，而问：一个愿望通过哪些中间环节影响现实？'},
{e:'知识地图',t:'为什么是这四本书？',c:['Shinn 看内在图景：如果一个人嘴上想成功，心里却一直预演失败，会发生什么？她贡献了愿望、想象、语言、潜意识和直觉。','Oettingen 看现实障碍：为什么只幻想成功，有时反而不行动？她贡献了 Mental Contrasting、WOOP、Obstacle 和 If–Then。','Wood 看自动行为：为什么目标变了，行为还停在过去？她贡献了 context、repetition、reward、friction 和 habit。','McAdams 看自我故事：一次失败为什么会变成“我就是不行”？他贡献了 narrative identity、agency、meaning 和 life story。'],n:'四本书不是互相证明，而是一层一层补前一本没有解释清楚的地方。'},
{e:'作者背景',t:'Florence Scovel Shinn：一百年前的“显化”传统',c:['Shinn 是艺术家、插画家、作家和 metaphysical lecturer。1925 年出版 The Game of Life and How to Play It，处于美国 New Thought 思潮中。','New Thought 混合了宗教、潜意识、自我暗示、积极思考与灵性信仰。它认为人的思想、语言和信念不仅解释现实，也会影响生活结果。','她真正关心的现实问题是：人嘴上想要更好的生活，心里却天天重复“不会发生”“我不配”“我总是失败”。','读这本书不能把它当现代心理学论文；它最有价值的部分是让人看见语言、想象、期待与行动方向的一致性。'],n:'她想解决的是：如何让人的语言、想象、期待与真正想去的方向一致。'},
{e:'章节地图',t:'《The Game of Life》十章：不是金句，而是一条路线',c:['人生的游戏：人生不只是竞争，而是一种有规则的互动。丰盛法则：匮乏感不仅让人难受，也会改变选择和行动。语言的力量：反复说的话会慢慢变成默认预期。','不抗拒：不要只和“不想要的结果”搏斗，要重新把注意力放回“想创造什么”。业力与宽恕：宽恕不是赞同，而是不让旧冲突继续控制自己。','卸下重担：做了准备、发了申请、完成行动以后，不要把每天几十次检查当成行动。爱：爱、占有、嫉妒和恐惧常被混在一起。','直觉与指引：不知道整条路时，先找到下一步。神圣设计：成功不只是赢过别人，还包括找到适合自己的位置。肯定语：改变每天默认运行的心理脚本。'],n:'这本书讨论的是：人如何从被恐惧和匮乏支配的内在状态，转向更开放、更愿意行动的状态。'},
{e:'机制图',t:'Shinn 的完整机制：一个愿望经历了什么？',c:['愿望：把“我想变好”变成具体状态。想象：在脑中建立“问题已经解决后”的终点画面。语言：停止每天把目标撤销。','期待：反复的语言和图像会形成默认预测，影响焦虑、犹豫、退出和证据筛选。放下抗拒：区分还能影响的事情和现在无法控制的事情，不把焦虑误认为行动。','直觉与指引：当不知道全部路径时，要求自己找到下一步可验证动作。行动：机会出现以后要真的去做，信念必须进入现实系统。','反馈：现实证据会反过来影响语言、期待和身份。愿望 → 行动 → 证据 → 新期待 → 新行动，形成循环。'],n:'Shinn 原本说思想会显现；更谨慎的现代翻译是：心理图景通过注意力、行为和机会识别间接影响结果。'},
{e:'经典故事',t:'新公寓和新地毯：为什么 Shinn 要人“先准备”？',c:['故事过程：住房紧缺，一个女人想搬新家，却一直担心找不到。Shinn 让她不要只盯着“现在没有”，而是进入“新生活正在到来”的状态。她先买了一张适合新家的地毯。','Shinn 的解释：这个行动证明她真正相信结果会出现，她已经为结果提前腾出空间。','现代解释：地毯不会召唤房子；但准备行为可能改变心理状态，从“没有可能”转成“我正在准备”，进而影响注意力、沟通和机会识别。','关键问题：如果她什么都不准备，只是每天重复“我一定会有房子”，这还算同一种方法吗？显然不是。'],n:'准备行为不是魔法，但它会把人从“等待”推向“我已经开始接近这件事”。'},
{e:'经典故事',t:'3000 美元：目标明确，但路径不要锁死',c:['故事背景：某人急需 3000 美元，但不知道钱从哪里来。焦虑会迫使她一直问“到底谁能给我这笔钱？”这其实已经把答案锁定在某个人、某条路径。','Shinn 的建议：明确结果，但允许它从自己现在没想到的方式出现。不是“必须 A 借给我”，而是允许退款、工作机会、项目、亲友或其他资源。','现代解释：路径锁得越死，越容易看不到替代资源。开放路径不是消极，而是让大脑继续搜索更宽的可能性。','可迁移到工作、学习和关系：想要的结果可以清楚，但不要把它绑死在唯一的人、唯一的方法、唯一的时间表上。'],n:'明确结果，不执着实现路径。'},
{e:'语言案例',t:'“我总是赶不上车”：语言如何变成预期？',c:['书中的父女式案例：一个人总说自己每次都赶不上车，另一个人则自然预期车会在合适的时候出现。重点不是交通工具，而是语言如何变成预期。','机制链：语言 → 预期 → 情绪 → 行动。预期自己会错过的人，可能更焦躁、更犹豫、更注意失败证据；预期能赶上的人，行动状态更稳定。','描述事实和定义命运不同。“我昨天没赶上车”是事实；“我就是总赶不上”已经是身份化语言。','这也是后来 McAdams 会继续讨论的问题：一两次事件怎样被人讲成关于“我是什么人”的故事。'],n:'语言不是只描述现实；反复语言会变成默认预测。'},
{e:'Shinn 的边界',t:'第一本书留下什么，又应该丢掉什么？',c:['值得保留：未来图景、语言意识、开放路径、行动前准备、做完可控部分后放下焦虑，以及留意下一步线索。','需要警惕：思想直接控制疾病和灾难、失败者只是信念不够、肯定语可以代替现实行动、用显化控制他人。','这本书真正启发人的地方，是让人看到内在状态会影响现实互动；真正危险的地方，是把所有现实结果都简单归因于个人信念。'],n:'如果积极想象不是魔法，一个更关键的问题出现了：积极想象真的会让人更努力吗？'},
{e:'第二本书',t:'Oettingen：为什么要重新思考积极思考？',c:['她研究的不是要不要积极，而是积极到哪一步。很多人喜欢想象成功后的场景：考好了、瘦下来了、项目做成了、关系改善了。','美好幻想会让人短期感觉更好，但这种提前获得的心理满足可能降低行动张力。想象成功后很舒服，现实中的训练、写简历、做题和解决问题却没有发生。','Oettingen 不是反对梦想，而是反对用梦想替代现实接触。愿景要保留，但必须马上和现实放在一起。'],n:'她真正要问的是：未来很美好，但现在到底什么东西挡着我？'},
{e:'心理对照',t:'Mental Contrasting：未来为什么必须和现实放在一起？',c:['未来：我希望三个月后体力更好。现实：我每天下班回家第一反应是躺下刷手机。两者一碰撞，真正问题变成：疲劳出现时没有备用动作。','英语例子：不是没时间，而是一看到生词多就逃避。项目例子：不是没能力，而是遇到难题就切换新想法。运动例子：不是不想运动，而是回家后没有启动机制。','只看未来容易变幻想；只看困难容易变焦虑。心理对照把两者放到同一画面里，让人看见真实差距。'],n:'障碍不是负能量，障碍是信息。'},
{e:'WOOP',t:'WOOP 四步：四个字母分别在做什么？',c:['Wish：确定方向。目标要有意义、有挑战、基本可行。不是“我要更好”，而是“一周读三次英文短文”。','Outcome：让目标变得有吸引力。问“如果实现，真正让我开心的是什么？”它不是让人沉迷幻想，而是确认这件事为什么值得做。','Obstacle：找到内部障碍。不停留在“没时间”，继续问为什么总是没时间，可能会发现“一有空就先拿手机”。','Plan：提前决定下一步。如果 X 出现，那么我就做 Y。障碍真正出现时，不用临场重新做决定。'],n:'WOOP 的关键不是更有动力，而是把最容易失败的瞬间提前设计。'},
{e:'完整案例',t:'WOOP 如何落地：学习、运动、项目三个场景',c:['学习：Wish 是遇到难题多坚持几分钟。Obstacle 是卡 5 分钟就想看答案。Plan 是如果卡住，就先重写已知条件和目标，再决定是否看提示。','运动：Wish 是每周运动三次。Obstacle 是回家后太累。Plan 是如果到家觉得累，就先换运动服走 10 分钟，再决定是否继续。','项目：Wish 是完成 MVP。Obstacle 是遇到技术难点就切换新想法。Plan 是如果想换项目，就先把新想法记到 Idea List，当前功能缩小范围继续做。'],n:'方法的重点不是“要努力”，而是“障碍出现时我已经知道下一步”。'},
{e:'研究边界',t:'WOOP 也可以帮助人放弃不值得的目标',c:['当目标可行时，心理对照会增强投入：愿景足够重要，障碍也被看见，人就更容易行动。','当目标明显不可行或代价过高时，心理对照也可能帮助人降低投入、缩小目标或转向更值得的事情。','成熟的目标管理不只是坚持，也包括开始、调整、暂停和放下。不是所有愿望都应该被显化。','MCII 有研究支持，但它不是“用了必成功”。效果会受目标可行性、实施质量和场景影响。'],n:'这本书把显化从“相信未来”推进到：面对现实，设计下一步。'},
{e:'第三本书',t:'Wendy Wood：为什么“知道”经常输给“习惯”？',c:['目标系统：我今天应该做什么？它需要意识、判断和选择，容易疲劳。习惯系统：我以前在这种场景下一般做什么？它更快、更自动。','很多日常行为是在相似情境下重复发生的，并不需要每次完整思考。晚上决定明天不玩手机，第二天躺到床上，手机已经在手里。','目标已经更新到 V2.0，行为系统可能仍在运行 V1.0。这解释了为什么知道正确答案不等于能做出正确行为。'],n:'改变行为，不只要改变想法，还要改变行为发生的环境。'},
{e:'经典实验',t:'电影院里的陈爆米花实验',c:['研究者真正想区分两种可能：人吃爆米花，是因为喜欢爆米花，还是因为电影院这个情境已经自动触发吃爆米花？','实验过程：观众进入电影院，拿到新鲜或不新鲜的爆米花。再按照过去行为区分强习惯者和弱习惯者。','实验结果：弱习惯者不好吃就少吃；强习惯者在熟悉电影院情境中，即使不好吃也更容易继续吃。','为什么重要：行为并不总是由“我现在还想不想要这个结果”控制。强习惯更像情境出现，行为先启动。'],n:'习惯绑定的，往往不是“我有多喜欢这个行为”，而是“我以前在这个场景里反复做过什么”。'},
{e:'习惯机制',t:'一个行为怎样从“我要做”变成“自然就做”？',c:['情境：稳定的时间、地点、前一个动作会成为线索。例如晚饭后坐到书桌前。','行为：在这个情境里反复做一个动作。行为越小，越容易开始。','奖励：快乐、放松、完成感，甚至只是逃开压力，都可能成为奖励。短视频、拖延和零食的奖励通常更即时。','重复与自动化：重点不是神奇的 21 天，而是在相同线索下重复多少次。最后不再需要每次重新说服自己。'],n:'真正高级的自律，常常是让自己少用一点自律。'},
{e:'摩擦力',t:'比“我要更自律”更有用的问题：怎样让正确行为更容易？',c:['降低好行为摩擦：书提前翻开，运动鞋放门口，第一步缩到 5 分钟，固定时间地点，完成后能看到进度。','增加坏行为摩擦：手机离开工作区，关闭通知，退出账号，零食移出视线，让游戏入口多一步。','拖延有时不是因为好玩，而是因为逃开难题立刻让焦虑下降，所以逃避本身也可能被奖励。','环境不是背景板。环境一直在告诉你：下一步最容易做什么。'],n:'如果环境一直在提示旧行为，意志力会消耗很快。'},
{e:'环境窗口',t:'环境变化为什么反而是改变习惯的好时机？',c:['Habit Discontinuity：旧习惯依赖稳定线索；搬家、换学校、换工位、换作息等变化会打断原有线索。','旧例子：一回家就躺床看手机。新设计：回家先在客厅完成一个固定小动作，手机不进入卧室。','环境改变虽然麻烦，但它也会让旧自动化短暂停止。这时建立新链条更容易。'],n:'改变习惯时，不要只问“我有没有毅力”，还要问“旧线索还在不在”。'},
{e:'第四本书',t:'McAdams：人不仅经历人生，还会把人生讲成一个故事',c:['Narrative Identity：人会把重构过的过去、现在的处境和想象的未来组织成一个连续故事。','故事不是编造事实，而是从大量事实里选择哪些重要、它们意味着什么。失败项目可以讲成“证明我不适合”，也可以讲成“暴露我缺销售和现金流能力”。','事实相近，意义不同。意义不同，下一步就不同。'],n:'人不仅生活在发生过什么里，也生活在“我认为这些事情说明了什么”里。'},
{e:'人生故事结构',t:'人生故事由什么组成？',c:['Narrative Tone：故事底色。世界总体安全还是危险？好事是否能持续？别人是否值得信任？','Key Scenes：高峰、低谷、转折点、早期记忆。它们会成为“我是谁”的证据。','Agency：我有没有能力影响生活？Communion：我和别人怎样连接？Ideological Setting：我认为什么值得追求？','Redemption：坏事后来长出能力或意义。Contamination：一次坏事把整个故事污染。'],n:'真正重要的不只是发生了什么，而是后来它被放进了怎样的故事结构。'},
{e:'具体场景',t:'答错题被笑：一个小场景如何变成身份',c:['事件：课堂上答错，同学笑。当时情绪：羞耻。后来解释：公开表达很危险。再后来身份：我不是善于表达的人。','行为结果：避免举手、避免发言、避免展示。现实证据：因为练习越来越少，表达确实越来越弱。','另一种并不虚假的解释：那次经历很难受，但它说明的是我当时没有准备好，也说明我很在意别人评价，不等于我永久不适合表达。'],n:'旧故事会筛选行为；新解释可以打开新的行为可能。'},
{e:'事实与解释',t:'“我就是这样的人”，通常不是事实，而是推理的终点',c:['Event：这次数学有 4 道计算题错了。Meaning：我很粗心。Identity：我就是一个粗心的人。Behavior：反正我一直都会这样。','项目做到一半停了，过快解释是我没执行力；更完整解释可能是范围太大、缺少反馈。表达卡壳，过快解释是我不适合表达；更完整解释是练习情境太少。','“我是这样的人”很难改变；“我有这样一种模式”就可以设计。重写故事不是改事实，而是不改变事实，改变因果解释。'],n:'事实保持不动，意义允许更新。'},
{e:'成年视角',t:'Generativity：成长最后不只是“我得到什么”',c:['McAdams 很重视 Generativity：我能为下一代、学生、家庭、组织留下些什么？','例子：教会别人一项能力，养育孩子，做一个有用产品，写一本书，建立一个长期运作的团队。','这会把“我要钱、成绩、工作”的问题升级成：如果我拥有这些能力，它们最后要服务什么？'],n:'身份层的问题最终会从“我得到什么”，走向“我创造什么”。'},
{e:'整合模型',t:'四本书放在一起：完整的是一个循环，不是一条直线',c:['Shinn：未来图景。我想去哪？Oettingen：现实对照。什么挡住我？WOOP：If–Then。障碍出现时我做什么？','Wood：环境设计和重复。怎样让正确行为更容易？怎样让它从努力变成自动？','真实证据：不是告诉自己“我是自律的人”，而是确实完成了一周 5 次启动动作。McAdams：身份更新。这些证据说明我正在成为谁？','新的身份又会影响下一轮愿望、注意力和行动，形成循环。'],n:'稳定改变不是先相信自己已经是某种人，而是允许新可能 → 行动 → 获得证据 → 更新故事。'},
{e:'成人案例',t:'完整案例：我想学会独立完成一个产品',c:['Shinn：未来图景是能独立完成并上线一个真实产品，不再只停留在想法和方案。','Oettingen：障碍是遇到难点就切换新想法。WOOP：如果卡住，就先缩小范围，而不是换项目。','Wood：固定开发环境，第一步小于 5 分钟，手机远离，完成一个小功能就立刻运行反馈。','McAdams：旧故事是“我很多年没开发了，已经不是能独立做开发的人”。新故事是“我曾有开发能力，现在是在重建端到端能力”。'],n:'这套模型不是专门用来管孩子，成年人同样会被愿望、障碍、习惯和身份故事影响。'},
{e:'学生案例',t:'如果目标换成“我数学就是不行”，到底发生了什么？',c:['未来图景：遇到难题不慌，能多坚持几分钟。现实障碍：卡 3 分钟就想看答案。','If–Then：如果卡住，就先写已知条件和目标。环境：答案册放远，桌上只保留题本和草稿纸。','重复：同类题固定使用同一步骤。证据：一周内有 6 道题是自己坚持做出来的。','身份更新：也许我不是“数学不行”，而是过去太早退出，缺少稳定步骤。'],n:'重点不是教育谁，而是看清机制：一次表现不等于一个固定身份。'},
{e:'最终区分',t:'所以“显化”到底是什么？',c:['玄学版：思想直接召唤现实。问题是缺乏可验证机制，也容易把失败归咎于个人信念。','简单励志版：相信 + 努力就行。问题是忽略障碍、环境、奖励和身份故事。','整合版本：未来图景改变注意力和期待；现实对照识别障碍；计划和环境改变行为；重复形成习惯；真实证据更新身份；身份又影响下一轮行动。'],n:'愿望本身不是结果；愿望必须进入行为系统，才可能改变现实。'},
{e:'结尾',t:'愿望不会直接改变世界，但它会改变你与世界互动的方式',c:['Shinn 留下：先看见未来，让语言和想象不再总是预演失败。','Oettingen 留下：再看清障碍，不用幻想替代现实接触。','Wood 留下：让正确行为变容易，通过环境、奖励和重复形成习惯。','McAdams 留下：用真实证据更新“我是谁”的故事，而不是让旧解释决定所有未来。'],n:'愿望会改变你看见什么、怎样解释、愿意尝试什么，以及重复什么；这些变化持续足够久，现实真的可能开始不同。'}
];
let current=0;function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function render(){const deck=document.getElementById('deck');deck.innerHTML=slides.map((s,i)=>`<section class="slide" data-slide="${i+1}"><div class="head"><div class="eyebrow">${esc(s.e)}</div><div class="page">${i+1} / ${slides.length}</div></div><h1>${esc(s.t)}</h1><div class="body"><div class="grid ${s.c.length==2?'two':s.c.length>=4?'four':''}">${s.c.map(x=>`<div class="card"><p>${esc(x)}</p></div>`).join('')}</div>${s.c.join(' ').includes('→')?`<div class="chain">${s.c.join(' ').match(/[^。]*→[^。]*/)?.[0].split('→').map(x=>`<span>${esc(x.trim())}</span>`).join('<b>→</b>')||''}</div>`:''}</div><div class="note">${esc(s.n)}</div></section>`).join('');show(0)}function show(i){current=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.slide').forEach((s,idx)=>s.classList.toggle('active',idx===current));document.querySelector('.bar').style.width=((current+1)/slides.length*100)+'%';history.replaceState(null,'','#s'+(current+1))}function fromHash(){const m=location.hash.match(/s(\d+)/);show(m?parseInt(m[1])-1:0)}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});window.addEventListener('hashchange',fromHash);render();fromHash();
</script>
</body>
</html>
