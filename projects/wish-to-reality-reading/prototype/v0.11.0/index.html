.deck{height:100vh;display:flex;align-items:center;justify-content:center;padding:2vh 1.4vw}.slide{display:none;position:relative;width:min(96vw,152vh);height:min(54vw,86vh);aspect-ratio:16/9;background:linear-gradient(160deg,#fffdf8,#fbf3e8);border:1px solid rgba(184,136,68,.28);border-radius:30px;box-shadow:0 20px 55px rgba(49,43,33,.16);padding:30px 38px 36px;overflow:hidden}.slide.active{display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.eyebrow{font-size:13px;font-weight:850;color:var(--gold);letter-spacing:.06em}.page{font-size:12px;color:#8c7a62;font-weight:800}h1{font-size:30px;line-height:1.13;margin:0 0 11px;color:var(--blue);letter-spacing:-.02em}.body{flex:1;min-height:0;display:flex;gap:14px}.grid{display:grid;gap:12px;width:100%;height:100%;align-content:stretch;min-height:0}.grid.c1{grid-template-columns:1fr}.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}.grid.c5{grid-template-columns:repeat(5,1fr)}.grid.r2{grid-auto-rows:1fr}.grid.r3{grid-auto-rows:1fr}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:0 6px 18px rgba(50,40,27,.05);font-size:14.2px;line-height:1.42;min-height:0;overflow:hidden;display:flex;flex-direction:column}.card:nth-child(5n+1){background:var(--warm)}.card:nth-child(5n+2){background:var(--bluebg)}.card:nth-child(5n+3){background:var(--greenbg)}.card:nth-child(5n+4){background:var(--redbg)}.card:nth-child(5n){background:var(--white)}.card b{display:block;color:var(--blue);font-size:15.5px;margin-bottom:6px;line-height:1.23}.card p{margin:0;color:#32405a}.grid.dense .card{font-size:12.5px;line-height:1.34;padding:10px}.grid.dense .card b{font-size:13.6px;margin-bottom:4px}.grid.medium .card{font-size:13.4px;line-height:1.38}.grid.medium .card b{font-size:14.6px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;height:100%}.hero h2{font-size:54px;line-height:1.08;color:var(--blue);margin:0 0 14px}.hero p{font-size:20px;line-height:1.55;color:#45546d}.hero-path{display:flex;flex-direction:column;gap:9px}.hero-path .step{background:white;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:850;color:var(--blue);font-size:15px}.bookrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.book{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:780;color:var(--blue);font-size:13px}.profile{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px;height:100%}.profile-badge{background:var(--dark);color:white;border-radius:20px;padding:20px;display:flex;flex-direction:column;justify-content:center}.profile-badge .big{font-size:42px;font-weight:900;line-height:1.05}.profile-badge .sub{font-size:15px;color:#d8e0ef;margin-top:14px;line-height:1.5}.popcorn{display:grid;grid-template-columns:.85fr 1.2fr .85fr;gap:13px;height:100%;min-height:0}.cinema{background:var(--dark);color:white;border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;min-height:0}.screen{background:linear-gradient(#f8ecd6,#eef2f8);border-radius:14px;min-height:150px;color:var(--dark);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;letter-spacing:.06em}.popcorns{display:flex;justify-content:center;gap:22px;font-size:42px}.mini{font-size:12.5px;line-height:1.4;color:#d8e0ef}.matrix{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.pill{border-radius:999px;background:#fff;border:1px solid var(--line);padding:8px 12px;font-weight:800;color:var(--blue);font-size:13px}.controls{position:fixed;right:20px;bottom:18px;display:flex;gap:8px;z-index:10}.controls button{border:0;background:#17233b;color:white;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}.progress{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(900px,72vw);height:4px;border-radius:999px;background:rgba(22,35,59,.16);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--blue));transition:.25s}@media(max-width:1000px){h1{font-size:24px}.slide{padding:24px 28px 34px}.grid.c4,.grid.c5{grid-template-columns:repeat(2,1fr)}.controls{display:none}.hero{grid-template-columns:1fr}.popcorn{grid-template-columns:1fr}}

const slides = [{"no": 1, "title": "从“显化”到习惯", "eyebrow": "四本书，四种解释", "req": "封面必须包含主题、问题、完整路径、四本书和第一张模型。", "note": "这不是“如何成功”的课，而是研究一个看不见的愿望怎样进入看得见的现实。", "cards": [{"title": "研究问题", "body": "愿望是怎么影响现实的？不是直接相信“想什么来什么”，而是沿着四本书追踪一个想法如何经过想象、障碍、行动、习惯与身份。"}, {"title": "完整路径", "body": "✨我想成为怎样 → 🧱现实卡在哪里 → ⚙️我真正做了什么 → 🔁什么开始变成习惯 → 📖最后我怎样解释自己。"}, {"title": "四本书", "body": "Shinn、Oettingen、Wendy Wood、McAdams 分别看见愿望、现实障碍、行为系统与身份故事。"}], "char_count": 220}, {"no": 2, "title": "Manifestation 到底在说什么？", "eyebrow": "概念入口", "req": "流行说法；四种常见做法；三种解释；为什么换问题；页底结论。", "note": "接下来不急着问显化是真是假，而是问：愿望到底通过哪些中间环节影响现实？", "cards": [{"title": "网上常见说法", "body": "“想象你已经拥有它”“相信它已经发生”“你的思想会吸引同频现实”。这些说法吸引人，因为它让现实还没改变的人，先允许另一种未来在脑中出现。"}, {"title": "Visualization｜视觉化", "body": "不是只说“我想成功”，而是想象我在哪里、正在做什么、成功后是什么感觉。它把抽象愿望变成可以体验的未来画面。"}, {"title": "Affirmation｜肯定语", "body": "“我有能力解决这个问题”“我正在变得更稳定”。它背后的直觉是：人每天反复使用的语言，会影响他如何理解自己。"}, {"title": "Law of Attraction｜吸引力法则", "body": "流行说法是“你关注什么就吸引什么”。争议最大，因为它容易从“注意力影响行动”滑到“思想直接控制外部世界”。"}, {"title": "Assume it is done", "body": "假设愿望已经实现，让人从未来回看现在：如果这个问题真的解决，我现在会怎么想、怎么做？它接近 future self / mental simulation 的表层动作。"}, {"title": "三种解释", "body": "玄学版：思想吸引现实。心理学版：思想改变注意力、期待和解释。行为科学版：这些变化进一步改变行为与环境，才可能稳定影响结果。"}], "char_count": 510}, {"no": 3, "title": "为什么是这四本书？它们像四个不同焦距的镜头", "eyebrow": "知识地图", "req": "四位作者；各自问题；关键词；贡献；总链条。", "note": "四本书不是互相证明，而是一层一层补前一本没有解释清楚的地方。", "cards": [{"title": "Shinn｜内在世界", "body": "她追问：如果一个人嘴上想成功，心里却一直排练失败，会发生什么？关键词：愿望、想象、语言、潜意识、直觉。贡献：先让未来在脑中有一个位置。"}, {"title": "Oettingen｜未来与现实的距离", "body": "她发现美好幻想不一定让人更努力，甚至可能提前获得心理满足。问题是：未来很美好，但现在到底什么挡着我？贡献：愿景必须碰到现实。"}, {"title": "Wendy Wood｜真实行为", "body": "她会说你们太重视想法了。现实中很多行为并不是每次重新决定，而是熟悉情境自动触发。贡献：改变行为，要改变行为发生的环境。"}, {"title": "McAdams｜自我故事", "body": "他问：这些经历最后让你觉得自己是谁？一次事件可能变成一种解释，再变成身份。贡献：真实经历最终会进入“我是谁”的故事。"}, {"title": "总链条", "body": "未来图景 → 现实障碍 → 行为系统 → 真实证据 → 自我故事。这个链条把“显化”从玄学拉回心理与行为。"}], "char_count": 420}, {"no": 4, "title": "Florence Scovel Shinn：一百年前的“显化”传统", "eyebrow": "第一本书｜作者与时代", "req": "作者身份；1925；New Thought；思想背景；她真正解决的问题。", "note": "Shinn 最有价值的地方，是让语言、想象和期待与真正想去的方向一致。", "cards": [{"title": "作者与时代", "body": "Florence Scovel Shinn（1871–1940），艺术家、插画家、作家和 spiritual teacher。1925 年出版 The Game of Life and How to Play It。"}, {"title": "New Thought 背景", "body": "20 世纪初美国流行一种思想：人的心智不仅解释现实，也会影响现实。这里混合宗教、自我暗示、潜意识、积极思考和灵性信仰。"}, {"title": "需要区分", "body": "她说的“潜意识”不等于今天严格的认知心理学概念。读这本书不能把它当成现代论文，而要看作自助思想传统。"}, {"title": "现实问题", "body": "很多人嘴上想改变，心里却反复说“不会发生”“我不配”“我总会失败”。人想要的东西，和每天在心理上重复的东西经常相反。"}, {"title": "她的核心观察", "body": "如果一个人每天都在语言里强化失败，他对机会、风险和行动的反应也可能被这种默认预期改变。"}], "char_count": 365}, {"no": 5, "title": "《The Game of Life》十章不是十个金句，而是一条路线", "eyebrow": "章节地图", "req": "十章地图；每章核心问题；作者观点；全书路线。", "note": "这本书真正讨论的是：人如何从恐惧和匮乏支配的内在状态，转向更有方向感、更开放、更愿意行动的状态。", "cards": [{"title": "01 人生的游戏", "body": "人生是战争，还是一种可以学习规则的互动？Shinn 先重新定义人生：你怎样对待世界，也会影响世界如何回应你。"}, {"title": "02 丰盛法则", "body": "为什么越害怕没有钱，越觉得处处匮乏？匮乏感让人只看见“没有、不够、会失去”，难以使用已有资源。"}, {"title": "03 语言的力量", "body": "“我每次都会粗心”说一遍是抱怨，说一百遍可能变成“我是粗心的人”。语言不仅描述现实，也塑造期待。"}, {"title": "04 不抗拒", "body": "越害怕某事，大脑越全是它。Shinn 要人把注意力从“不想要的结果”转回“想创造什么”。"}, {"title": "05 宽恕", "body": "过去冲突为什么持续影响今天？宽恕不是说对方没错，而是不再让旧事占用今天的心理资源。"}, {"title": "06 卸下重担", "body": "行动后是否还要一直焦虑？Shinn 区分能影响的事和只能等待反馈的事，避免用焦虑伪装行动。"}, {"title": "07 爱", "body": "害怕失去是否等于爱？她把爱、占有、嫉妒、恐惧和控制区分开。"}, {"title": "08 直觉与指引", "body": "不知道整条路时，先找到下一步：联系谁、查什么、试什么。把模糊焦虑缩小成可验证动作。"}, {"title": "09 自我表达", "body": "成功是否只有赢过别人？她强调找到更适合自己的能力组合、表达方式和人生位置。"}, {"title": "10 肯定语", "body": "先识别旧语言，再建立新表达。不是喊口号，而是改变每天默认运行的心理脚本。"}], "char_count": 820}, {"no": 6, "title": "Shinn 的完整机制：一个愿望究竟经历了什么？", "eyebrow": "核心机制图", "req": "八节点：愿望、想象、语言、期待、放下、直觉、行动、反馈；作者版本与现代解释；转折。", "note": "Shinn 让人觉得有道理，但也留下一个漏洞：如果我每天把成功想得很美好，我真的会更行动吗？", "cards": [{"title": "🎯 愿望", "body": "先定义真正想要的东西。不是“我想变优秀”，而是“遇到难题时我不会立刻慌，能稳定把会做的题做好”。"}, {"title": "🖼 想象", "body": "在脑中建立终点画面：不是一直盯着“现在还没做到”，而是给大脑一个“我要去哪里”的参照。风险是只停在这里会变成幻想。"}, {"title": "🗣 语言", "body": "停止每天撤销目标。早上说要运动，下午说“我这种人坚持不了”，真正被强化的是“我坚持不了”。"}, {"title": "🧠 期待", "body": "语言和画面重复久了，会形成默认预测。预期失败的人更焦虑、更早退出、更注意失败信号。"}, {"title": "🧘 放下抗拒", "body": "做完能做的以后，不要用反复检查和焦虑假装自己还在行动。区分能控制和不能控制。"}, {"title": "🔎 直觉 / Guidance", "body": "听起来神秘，现代翻译是：当不知道全部路径时，先找到下一步最值得验证的动作。"}, {"title": "🚶 行动", "body": "机会出现后必须接住。Shinn 的故事里常有实际动作：买地毯、联系别人、去某处、作出决定。"}, {"title": "🌍 反馈", "body": "现实结果反过来塑造信念。12 次真实完成，比 100 句“我是自律的人”更能形成新证据。"}], "char_count": 720}, {"no": 7, "title": "故事：新公寓和新地毯——为什么要“先准备”？", "eyebrow": "Shinn 故事一", "req": "四格故事；Shinn解释；现代解释；问题框；页底结论。", "note": "准备不是魔法，而是让人从“没有可能”转向“我正在为机会准备”。", "cards": [{"title": "故事 1：住房紧缺", "body": "一个女人想搬到新公寓，但当时住房紧缺。她如果每天只重复“根本找不到”，就会一直处在无望状态。"}, {"title": "故事 2：先买地毯", "body": "Shinn 鼓励她先进入“新生活正在到来”的状态。她于是先买了一张适合新家的地毯。"}, {"title": "故事 3：机会出现", "body": "后来新的住房机会出现。Shinn 把这理解为：她真正相信结果会出现，所以先做出了与结果一致的行动。"}, {"title": "现代解释", "body": "不是地毯召唤房子，而是准备行为改变心理状态，从“我没有机会”变成“我正在准备”。这会影响注意力、沟通和机会识别。"}, {"title": "问题框", "body": "如果她什么都不准备，只是每天重复“我一定会有房子”，这还算同一种方法吗？显然不是。"}], "char_count": 390}, {"no": 8, "title": "目标明确，但不要锁死路径", "eyebrow": "Shinn 故事二", "req": "3000美元故事；单一路径 vs 开放路径；现代解释；页底结论。", "note": "明确结果，不执着实现路径，这是第一本书很值得留下的观点。", "cards": [{"title": "急需 3000 美元", "body": "某人急需一笔钱，但不知道来源。焦虑会迫使她不停问：到底谁能给我这 3000 美元？"}, {"title": "单一路径", "body": "如果答案被锁定为“必须某个人借给我”，机会范围就被缩窄。她可能忽略退款、工作、项目、亲友、资源交换等路径。"}, {"title": "开放路径", "body": "Shinn 的建议是：我需要这个结果，但允许它从我现在没有想到的方式出现。目标清楚，渠道开放。"}, {"title": "现代解释", "body": "这不是宇宙安排，而是路径锁得越死，越容易看不到替代资源；放开渠道后，人更容易发现可用选项。"}], "char_count": 310}, {"no": 9, "title": "语言如何变成预期：父亲、女儿和赶车", "eyebrow": "Shinn 故事三", "req": "赶车故事；语言→预期→情绪→行动；事实 vs 命运；页底结论。", "note": "一句话可怕的地方，不在于它说了一次，而在于它被重复到变成默认预测。", "cards": [{"title": "故事场景", "body": "有人总说“我每次都赶不上车”。另一个人则自然预期“车会在合适的时候出现”。重点不是交通工具，而是语言如何变成期待。"}, {"title": "语言 → 预期", "body": "当一个人反复说“我总是错过”，事情还没发生，大脑已经在预测失败。"}, {"title": "预期 → 情绪", "body": "预期失败会带来焦躁、犹豫和注意力变窄。人会更容易寻找失败证据。"}, {"title": "情绪 → 行动", "body": "焦躁的人可能更乱、更慢、更容易放弃；稳定的人更可能做出有效动作。"}, {"title": "事实 vs 命运", "body": "“我昨天没赶上车”是事实；“我就是总赶不上”已经是身份化语言。"}], "char_count": 360}, {"no": 10, "title": "目标要清楚，方案要保持弹性", "eyebrow": "Shinn 故事群", "req": "贫穷的人；钢琴；这个或更好的；现代翻译；边界。", "note": "Shinn 留下的不是“指定宇宙送来某物”，而是目标清楚、方案弹性。", "cards": [{"title": "贫穷的人", "body": "Shinn 常提醒不要只按表面标签判断一个人或资源。看起来“贫穷”的人，也可能成为连接、信息或帮助的来源。"}, {"title": "钢琴故事", "body": "想要新钢琴时，旧钢琴后来可能被别人租走或流动起来。重点是资源并非只能通过购买一种方式进入生活。"}, {"title": "“这个或更好的”", "body": "Divine Selection 的现代翻译是：可以清楚表达偏好，但不要把某个人、某件物、某条路当成唯一答案。"}, {"title": "边界提醒", "body": "弹性不是放弃判断，也不是把所有结果都解释成“更好”。它只是避免因为过度指定路径而错过现实中的其他可能。"}], "char_count": 330}, {"no": 11, "title": "Mental Contrasting：未来为什么必须和现实放在一起？", "eyebrow": "第二本书｜Oettingen", "req": "积极幻想问题；未来/现实张力；三个例子；页底结论。", "note": "障碍不是负能量，障碍是信息。", "cards": [{"title": "她重新思考积极思考", "body": "Oettingen 发现，美好幻想会让人短期感觉更好，但这种提前获得的心理满足，有时会降低紧迫感。她不是反对梦想，而是反对用梦想替代现实接触。"}, {"title": "未来", "body": "例如：我希望三个月后体力明显更好。这个未来让目标有吸引力。"}, {"title": "现实", "body": "现实是：我每天下班回家第一反应是躺下刷手机。两者放在一起，真正问题才出现。"}, {"title": "心理张力", "body": "原来挡住我的不是不想运动，而是疲劳出现时没有备用动作。未来和现实碰撞，产生行动问题。"}, {"title": "例子：英语", "body": "不是没时间，而是一看到生词多就逃避。"}, {"title": "例子：项目", "body": "不是没能力，而是一遇技术问题就切换新项目。"}], "char_count": 430}, {"no": 12, "title": "WOOP 四步：四个字母分别完成不同心理任务", "eyebrow": "方法页", "req": "Wish；Outcome；Obstacle；Plan；例子；页底结论。", "note": "WOOP 的关键不是更有动力，而是在最容易失败的瞬间提前设计下一步。", "cards": [{"title": "W｜Wish", "body": "确定方向。目标要有意义、有挑战、基本可行。不是“我要更好”，而是“一个月内把某件事稳定下来”。"}, {"title": "O｜Outcome", "body": "让目标变得有吸引力。问：如果实现，真正让我开心的是什么？这不是沉浸幻想，而是确认为什么值得。"}, {"title": "O｜Obstacle", "body": "找到内部障碍。不要停在“没时间”，继续问：为什么总没时间？可能真正障碍是“一有空就先拿手机”。"}, {"title": "P｜Plan", "body": "提前决定下一步。如果 X 出现，那么我就做 Y。障碍出现时，不需要临场重新做决定。"}, {"title": "例子", "body": "如果我想拿手机逃开难题，那么我先把当前题目的已知条件抄出来。"}], "char_count": 360}, {"no": 13, "title": "WOOP 不只适合学习：三个场景并排看", "eyebrow": "案例页", "req": "学习、运动、项目三案例；Wish/Obstacle/If-Then；页底结论。", "note": "方法的关键不是更有动力，而是把最容易失败的瞬间提前设计。", "cards": [{"title": "学习", "body": "Wish：卡题时不马上看答案。Obstacle：卡 5 分钟就烦。If–Then：如果卡住，就先重写已知条件和目标，再决定是否看提示。"}, {"title": "运动", "body": "Wish：下班后保持运动。Obstacle：回家太累就取消。If–Then：如果觉得累，就先换衣服走 10 分钟，再决定是否继续。"}, {"title let current=0;
function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function classFor(n,totalChars){let cols=n===1?'c1':n===2?'c2':n===3?'c3':n===4?'c4':n<=6?'c3':n<=8?'c4':'c5';let dense=n>=7||totalChars>760?' dense':totalChars>520?' medium':'';let rows=n>3?' r2':'';return `grid ${cols}${rows}${dense}`;}
function card(c){return `<div class="card"><b>${esc(c.title)}</b><p>${esc(c.body)}</p></div>`}
function renderHero(s,total){const path=['✨ 我想成为怎样？','🧱 现实卡在哪里？','⚙️ 我真正做了什么？','🔁 什么开始变成习惯？','📖 我怎样解释自己？'];return `<section class="slide" data-slide="${s.no}"><div class="head"><div class="eyebrow">${esc(s.eyebrow)}</div><div class="page">${s.no} / ${total}</div></div><div class="body"><div class="hero"><div><h2>从“显化”到习惯</h2><p>愿望是怎么影响现实的？从 4 本书，看一个想法怎样经过想象、障碍、行动、习惯与身份，最终影响人的生活轨迹。</p><div class="bookrow"><span class="book">Shinn</span><span class="book">Oettingen</span><span class="book">Wendy Wood</span><span class="book">McAdams</span></div></div><div class="hero-path">${path.map(x=>`<div class="step">${x}</div>`).join('')}</div></div></div><div class="note">${esc(s.note)}</div></section>`}
function renderPopcorn(s,total){
 return `<section class="slide" data-slide="${s.no}"><div class="head"><div class="eyebrow">${esc(s.eyebrow)}</div><div class="page">${s.no} / ${total}</div></div><h1>${esc(s.title)}</h1><div class="body"><div class="popcorn demo"><div class="cinema"><div><b style="font-size:22px">🎬 实验场景</b><div class="screen">CINEMA</div><div class="seats">${Array.from({length:10}).map(()=>'<span class="seat"></span>').join('')}</div></div><div class="bucket-row"><span class="bucket">🍿</span><span class="bucket" style="font-size:58px">🍿</span><span class="bucket">🍿</span></div><div class="mini">研究者把观众放回熟悉场景：电影院、座位、电影开始、手里有爆米花。问题不是“爆米花好不好吃”，而是场景会不会先把动作启动。</div></div><div class="exp-panel"><div style="font-size:21px;font-weight:900;color:var(--blue);margin-bottom:2px">🧪 实验怎么说明“习惯”在起作用？</div><div class="step-card"><div class="step-num">1</div><div><b>给观众爆米花</b><p>有些爆米花新鲜，有些已经不新鲜，口感明显变差。</p></div></div><div class="step-card"><div class="step-num">2</div><div><b>区分两类人</b><p>一类平时没有强烈“电影院吃爆米花”习惯；另一类在电影院里经常吃。</p></div></div><div class="step-card"><div class="step-num">3</div><div><b>观察真实行为</b><p>如果只是因为“好吃”才吃，不新鲜时大家都应该明显少吃。</p></div></div><div class="step-card"><div class="step-num">4</div><div><b>结果出现差异</b><p>弱习惯者不好吃就少吃；强习惯者即使拿到不新鲜爆米花，在熟悉电影院情境中仍更容易继续吃。</p></div></div><div class="result-pair"><div class="result-card"><b>没有强习惯的人</b><p>主要根据味道判断：不好吃，就少吃。</p><div class="barline"><span style="width:38%"></span></div></div><div class="result-card"><b>强习惯的人</b><p>情境先触发动作：电影院本身像一个行为开关。</p><div class="barline"><span style="width:82%"></span></div></div></div></div><div class="meaning-col"><div class="meaning-box"><b>↪ 作者真正想说明</b><p>习惯不是“我经常做某事”这么简单，而是<strong>情境线索</strong>和<strong>过去反复做过的行为</strong>之间形成了自动连接。熟悉场景出现时，行为可能先于理性评价启动。</p></div><div class="daily-box"><h3>🏠 迁移到日常</h3><div class="daily-item"><div class="ico">🛏</div><div><b>上床</b><p>手自然去摸手机，不一定是认真决定。</p></div></div><div class="daily-item"><div class="ico">💻</div><div><b>工作卡住</b><p>下意识打开消息，先逃离难题带来的压力。</p></div></div><div class="daily-item"><div class="ico">📺</div><div><b>看电视</b><p>零食变成固定搭配，身体先于理性启动。</p></div></div><div class="daily-item"><div class="ico">🚪</div><div><b>回家</b><p>固定路线和姿势，会把人带回旧节奏。</p></div></div></div></div></div></div><div class="note">习惯绑定的往往不是“我有多喜欢”，而是“我过去在这个场景里反复做过什么”。</div></section>`
}
function renderGeneric(s,total){const n=s.cards.length,chars=s.char_count;if(s.no===4||s.no===15||s.no===20){const first=s.cards[0]||{title:'',body:''};const rest=s.cards.slice(1);return `<section class="slide" data-slide="${s.no}"><div class="head"><div class="eyebrow">${esc(s.eyebrow)}</div><div class="page">${s.no} / ${total}</div></div><h1>${esc(s.title)}</h1><div class="body"><div class="profile"><div class="profile-badge"><div class="big">${esc(s.title.split('：')[0]).replace('Florence Scovel Shinn','Florence\nScovel\nShinn').replace('Wendy Wood','Wendy\nWood').replace('McAdams','McAdams')}</div><div class="sub">${esc(first.body)}</div></div><div class="${classFor(rest.length,chars)}">${rest.map(card).join('')}</div></div></div><div class="note">${esc(s.note)}</div></section>`}return `<section class="slide" data-slide="${s.no}"><div class="head"><div class="eyebrow">${esc(s.eyebrow)}</div><div class="page">${s.no} / ${total}</div></div><h1>${esc(s.title)}</h1><div class="body"><div class="${classFor(n,chars)}">${s.cards.map(card).join('')}</div></div>${s.note?`<div class="note">${esc(s.note)}</div>`:''}</section>`}
function render(s,total){if(s.no===1)return renderHero(s,total);if(s.no===16)return renderPopcorn(s,total);return renderGeneric(s,total)}
function show(i){current=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.slide').forEach((s,idx)=>s.classList.toggle('active',idx===current));document.querySelector('.bar').style.width=((current+1)/slides.length*100)+'%';history.replaceState(null,'','#s'+(current+1))}
function fromHash(){const m=location.hash.match(/s(\d+)/);show(m?parseInt(m[1])-1:0)}
document.getElementById('deck').innerHTML=slides.map(s=>render(s,slides.length)).join('');document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});window.addEventListener('hashchange',fromHash);fromHash();
