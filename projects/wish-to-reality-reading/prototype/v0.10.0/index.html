<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>从显化到习惯 v0.10.0</title><style>:root{--bg:#f2eadf;--paper:#fffaf5;--ink:#17233b;--muted:#5b6677;--blue:#183c70;--gold:#b88745;--line:#dac8ad;--warm:#f6ead0;--bluebg:#e9f0fb;--greenbg:#e9f2ec;--redbg:#f7e7e5;--dark:#17233b}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(circle at 10% 0,#fff8ee 0,#f2eadf 46%,#e5d7c2 100%);color:var(--ink)}.deck{height:100vh;display:flex;align-items:center;justify-content:center;padding:2vh 1.4vw}.slide{display:none;width:min(96vw,152vh);height:min(54vw,86vh);aspect-ratio:16/9;background:linear-gradient(160deg,#fffdf8,#fbf3e8);border:1px solid rgba(184,136,68,.28);border-radius:30px;box-shadow:0 20px 55px rgba(49,43,33,.16);padding:30px 38px 36px;overflow:hidden}.slide.active{display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.eyebrow{font-size:13px;font-weight:850;color:var(--gold);letter-spacing:.06em}.page{font-size:12px;color:#8c7a62;font-weight:800}h1{font-size:30px;line-height:1.13;margin:0 0 11px;color:var(--blue);letter-spacing:-.02em}.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:11px}.grid{display:grid;gap:12px;width:100%;height:100%;min-height:0}.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}.card{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:0 6px 18px rgba(50,40,27,.05);font-size:14.1px;line-height:1.42;overflow:hidden}.card:nth-child(5n+1){background:var(--warm)}.card:nth-child(5n+2){background:var(--bluebg)}.card:nth-child(5n+3){background:var(--greenbg)}.card:nth-child(5n+4){background:var(--redbg)}.card b{display:block;color:var(--blue);font-size:15.4px;margin-bottom:6px;line-height:1.25}.card p{margin:0;color:#32405a}.dense .card{font-size:12.6px;line-height:1.34;padding:10px}.dense .card b{font-size:13.6px}.medium .card{font-size:13.4px}.note{background:#17233b;color:white;border-radius:15px;padding:10px 16px;font-weight:760;text-align:center;font-size:14.5px;line-height:1.42;margin-top:11px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;height:100%}.hero h2{font-size:54px;line-height:1.08;color:var(--blue);margin:0 0 14px}.hero p{font-size:20px;line-height:1.55;color:#45546d}.steps{display:flex;flex-direction:column;gap:9px}.step{background:white;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:850;color:var(--blue);font-size:15px}.books{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.book{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:780;color:var(--blue);font-size:13px}.profile{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px;height:100%}.profilebox{background:var(--dark);color:white;border-radius:20px;padding:20px;display:flex;flex-direction:column;justify-content:center}.profilebox .big{font-size:42px;font-weight:900;line-height:1.05}.profilebox .sub{font-size:15px;color:#d8e0ef;margin-top:14px;line-height:1.5}.pop{display:grid;grid-template-columns:.85fr 1.2fr .85fr;gap:13px;height:100%;min-height:0}.cinema{background:var(--dark);color:white;border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}.screen{background:linear-gradient(#f8ecd6,#eef2f8);border-radius:14px;min-height:150px;color:var(--dark);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;letter-spacing:.06em}.popcorns{display:flex;justify-content:center;gap:22px;font-size:42px}.mini{font-size:12.5px;line-height:1.4;color:#d8e0ef}.controls{position:fixed;right:20px;bottom:18px;display:flex;gap:8px}.controls button{border:0;background:#17233b;color:white;border-radius:999px;padding:10px 14px;font-weight:800}.progress{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(900px,72vw);height:4px;border-radius:999px;background:rgba(22,35,59,.16);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--blue));transition:.25s}@media(max-width:1000px){h1{font-size:24px}.slide{padding:24px 28px 34px}.c4,.c5{grid-template-columns:repeat(2,1fr)}.controls{display:none}.hero,.pop,.profile{grid-template-columns:1fr}}</style></head><body><div id="deck" class="deck"></div><div class="progress"><div class="bar"></div></div><div class="controls"><button id="prev">← 上一页</button><button id="next">下一页 →</button></div><script>const slides=[
{e:'四本书，四种解释',t:'从“显化”到习惯：愿望是怎么影响现实的？',hero:true,n:'核心问题：愿望不会直接改变世界，但它可能改变人与世界互动的方式。'},
{e:'概念澄清',t:'Manifestation 到底在说什么？',c:[['网上常见版本','visualization、affirmation、law of attraction、assume it is done 共同指向一种直觉：现实还没改变，但人可以先在心理上进入另一种未来。'],['🖼 Visualization','把“我想成功”变成具体场景：我在哪里？正在做什么？成功后是什么感觉？抽象目标因此变成可体验的未来画面。'],['🗣 Affirmation','肯定语真正值得讨论的地方，不是咒语是否灵验，而是反复语言是否正在塑造默认期待。'],['🧲 Law of Attraction','争议最大，因为它容易从“注意力影响行动”滑到“思想直接控制现实”。'],['🌌 Assume it is done','从“愿望已经实现”的角度回看现在：如果问题已经解决，我此刻会怎样选择？'],['三种解释','玄学版：思想吸引现实；心理学版：思想改变注意力、期待和解释；行为科学版：心理变化进入计划、行动、环境和习惯后，才可能稳定改变现实。']],n:'不急着问“显化真假”，先问：一个愿望通过哪些中间环节影响现实？'},
{e:'知识地图',t:'为什么是这四本书？它们像四个不同焦距的镜头',c:[['📘 Shinn｜内在图景','她关心你每天在想什么、说什么、期待什么。贡献：先让未来在脑中有一个位置。'],['📗 Oettingen｜现实障碍','她发现美好幻想不一定带来行动。贡献：愿景必须碰到现实。'],['📙 Wendy Wood｜自动行为','她提醒我们：很多时候是情境和习惯在替人行动。贡献：改变行为，要改变行为发生的环境。'],['📕 McAdams｜自我故事','他追问：这些经历最后让你觉得自己是谁？贡献：真实经历最终会进入身份叙事。'],['总链条','未来图景 → 现实障碍 → 行为系统 → 真实证据 → 自我故事。四本书是一层一层补全前一本没有解释清楚的部分。']],n:'重点不是让四本书得出同一个答案，而是看它们如何逐层补全“愿望影响现实”的机制。'},
{e:'第一本书｜背景',t:'Florence Scovel Shinn：一百年前的“显化”传统',profile:'Florence\nScovel\nShinn',c:[['作者与时代','1871–1940，艺术家、插画家、作家和灵性讲师。1925 年出版《The Game of Life and How to Play It》。她不是现代实验心理学家，而是在灵性/自助传统中讨论语言、潜意识和人生结果。'],['New Thought 背景','20 世纪初美国流行 New Thought：思想、语言和信念不仅解释现实，也会影响生活结果。'],['她看见的矛盾','很多人嘴上想改变，心里却反复说“不会发生”“我不配”“我总会失败”。'],['她真正想解决的问题','如何让语言、想象、期待与真正想去的方向一致。'],['阅读提醒','保留语言、想象和期待对行动的影响；警惕“思想直接控制外界事件”的说法。']],n:'Shinn 最有价值的部分，是让人意识到：旧语言会把人困在旧未来里。'},
{e:'章节地图',t:'《The Game of Life》十章不是零散金句，而是一条路线',c:[['01 游戏','人生是战争，还是可以学习规则的互动？作用：重新定义“人生是什么”。'],['02 丰盛','越怕没有，为什么越陷入匮乏？作用：从匮乏感转向准备接收。'],['03 语言','“我每次都会搞砸”只是一句话吗？作用：看见语言怎样形成默认预期。'],['04 不抗拒','越害怕某事，为什么脑中越全是它？作用：把注意力转回“想创造什么”。'],['05 宽恕','旧冲突为什么持续影响今天？作用：不让旧事继续占用心理资源。'],['06 卸下重担','做完能做的以后，还要一直焦虑吗？作用：区分行动和焦虑。'],['07 爱','害怕失去是不是等于爱？作用：区分爱、占有、嫉妒和控制。'],['08 指引','不知道整条路时怎么办？作用：把焦虑变成可验证的下一步。'],['09 适合自己的位置','成功是不是只有赢过别人？作用：从最好转向适合我的表达方式。'],['10 肯定语','怎样改变旧信念？作用：识别旧脚本，再建立新的语言。']],n:'这本书讨论的是：人如何从恐惧和匮乏转向更有方向、更开放、更愿意行动的状态。'},
{e:'第一本书｜核心图',t:'Shinn 的完整机制：一个愿望究竟经历了什么？',c:[['🎯 1 愿望','把“我想变好”变成具体方向。不是“数学变好”，而是“遇到难题时不立刻放弃”。'],['🖼 2 想象','建立终点画面。风险：如果只停在想象，就会变成纯幻想。'],['🗣 3 语言','状态语言“我这几天没坚持”和身份语言“我就是坚持不了”完全不同。'],['🧠 4 期待','语言和画面重复久了，会形成默认预测，影响情绪、犹豫、退出时间和证据筛选。'],['🧘 5 放下抗拒','停止用焦虑假装还在行动。做完准备后，别把反复检查误认为努力。'],['🔎 6 指引','不知道整条路时，找一个可验证的下一步：联系、查资料、做最小版本。'],['🚶 7 行动','机会出现后必须真的接住。Shinn 的故事通常不只是想，还有买地毯、联系、申请、尝试。'],['🌍 8 反馈','现实反馈会反过来更新信念。12 次真实行动比一句“我是自律的人”更有证据力量。']],n:'现代翻译：想象和语言 → 改变注意力与期待 → 改变情绪与行为 → 改变机会识别和结果。'},
{e:'故事页',t:'新公寓和新地毯：为什么 Shinn 总要求人“先准备”？',c:[['🏚 现实处境','她想搬进新公寓，但住房紧缺。如果每天只想“根本找不到”，心理就会停在无望状态。'],['😟 内在语言','问题不只是没有房子，而是她持续在脑中排练“不会发生”。'],['🛍 先买地毯','她先买了一张适合新家的地毯。Shinn 认为这个动作说明她真的把自己放进“新生活正在到来”的状态。'],['🏠 后来机会出现','故事里后来住房机会出现。Shinn 说这是“为结果提前腾出空间”。'],['现代解释','地毯不会召唤房子，但准备行为改变了她与目标的关系：从“没有机会”变成“我正在准备”。'],['反向问题','如果她什么都不准备，只是每天重复“我一定会有房子”，这不再是同一种方法。']],n:'重点不是地毯有魔力，而是：准备行为让未来从想象进入现实系统。'},
{e:'故事组',t:'目标明确，但不要把路径锁死',c:[['💵 3000 美元故事','某人急需一笔钱，最初只问“到底谁能给我？”这把答案锁死在某个人给钱这一条路上。'],['Shinn 的建议','明确需要的结果，但允许它从没想到的路径出现：退款、工作、项目、亲友帮助、资源交换。'],['现代解释','路径越锁死，越容易看不到替代资源。目标清楚，方案保持弹性。'],['🎹 钢琴故事','想要新钢琴时，旧钢琴可能被租走、交换或流动出去，资源通过关系重新组织。'],['“这个或更好的”','我可以知道真正需要什么，但不要把某个人、某个物品、某条路当成唯一答案。'],['边界提醒','开放路径不是逃避现实条件，而是避免把唯一答案没出现误解成没有任何答案。']],n:'明确结果，不执着路径。目标要清楚，方案要保持弹性。'},
{e:'语言与边界',t:'Shinn 留下什么，又应该丢掉什么？',c:[['🗣 “我总赶不上车”','类似案例的重点不在车，而是语言怎样变成预测。反复说自己总会错过，出门前就带着失败预期。'],['语言链条','语言 → 预期 → 情绪 → 行动。预期失败的人更焦虑、更犹豫、更早退出，也更容易只看见失败证据。'],['值得保留','愿望要清楚；语言影响期待；目标明确但路径开放；做完可控行动后学会放下过度焦虑。'],['需要丢掉','思想不能直接控制疾病、灾难和他人选择；失败不能简单归咎于信念不够。'],['转折问题','如果把神秘部分拿掉，还剩一个关键问题：积极想象到底会不会提高行动力？']],n:'第一本书给出内在图景，但还没解决“只想美好未来是否会行动”的问题。'},
{e:'第二本书｜问题意识',t:'Oettingen：她不是反对积极，而是反对停在积极',profile:'Oettingen',c:[['作者与研究','Gabriele Oettingen 研究未来思维、动机、目标和自我调节。'],['普通场景','一个学生反复想象进前十名：老师表扬、父母高兴、自己轻松。问题是行为有没有改变？'],['她的发现','美好幻想能短期让人感觉更好，但可能提前提供心理满足，降低行动张力。'],['她反对什么','她不是反对梦想，而是反对用梦想替代现实接触。'],['转折','未来图景仍然重要，但下一步必须问：现实中到底什么挡住我？']],n:'愿景不是错，错的是停在愿景里。'},
{e:'心理对照',t:'Mental Contrasting：未来为什么必须和现实放在一起？',c:[['🌟 未来','我希望三个月后体力明显更好。未来图景提供方向和吸引力。'],['🧱 当前现实','我每天下班回家第一反应是躺下刷手机。现实告诉我真正卡在哪里。'],['⚡ 心理张力','未来与现实同时出现，人才会看见差距，不再只沉浸在美好感觉里。'],['🔧 行动问题','真正障碍不是不想运动，而是疲劳时没有备用动作。'],['英语例子','不是没时间，而是一看到生词多就逃。'],['项目例子','不是没能力，而是一遇难题就切换新想法。']],n:'障碍不是负能量，障碍是信息。'},
{e:'WOOP',t:'WOOP 四步：四个字母分别完成四种心理任务',c:[['W｜Wish','确定方向。目标要有意义、有挑战、基本可行。不是“我要更好”，而是“每周读三次英文短文”。'],['O｜Outcome','让目标有吸引力。问：如果实现，真正让我开心的是什么？'],['O｜Obstacle','找到内部障碍。不要停在“没时间”，继续问：为什么总是没时间？'],['P｜Plan','提前决定下一步。如果 X 出现，那么我就做 Y。障碍真正出现时不需要临场重新决定。']],n:'WOOP 的重点不是更有毅力，而是把最容易失败的瞬间提前设计。'},
{e:'三个场景',t:'WOOP 不只适合学习：三个场景并排看',c:[['学习场景','Wish：独立做题更稳定。Obstacle：卡 5 分钟就看答案。Plan：如果卡住，先重写已知条件和目标。'],['运动场景','Wish：每周运动三次。Obstacle：回家太累。Plan：如果觉得累，就先换衣服走 10 分钟，再决定。'],['项目场景','Wish：完成 MVP。Obstacle：新想法诱惑。Plan：如果冒出新想法，先记到 Idea List，当前 MVP 完成前不切项目。'],['共同点','它们都不是靠“我一定要坚持”，而是把失败瞬间设计成一个具体下一步。'],['真正价值','人在最容易失败的瞬间，往往没有力气重新思考。WOOP 把思考提前完成。']],n:'方法关键不是提高热血，而是把最容易失败的瞬间提前设计。'},
{e:'目标边界',t:'WOOP 不是万能坚持术，也会帮人判断是否该调整目标',c:[['目标可行时','心理对照会增强投入，因为未来和现实之间的差距变得清楚。'],['目标不现实时','它也可能帮助人降低投入，缩小目标，或转向更值得的方向。'],['成熟的目标管理','不仅包括开始和坚持，也包括调整、暂停和放下。'],['不是所有愿望都该实现','有些目标代价太高，或并不真正重要。'],['它补上什么','它把显化从“相信未来”推进到“看见现实”。']],n:'不是所有愿望都应该被显化；有些愿望应该被重新理解、缩小或放下。'},
{e:'第三本书｜习惯科学',t:'Wendy Wood：很多日常行为不是每次重新决定',profile:'Wendy\nWood',c:[['目标系统','我今天应该做什么？需要意识、判断和选择，容易疲劳。'],['习惯系统','我以前在这种场景下一般做什么？更快、更自动，也更省力。'],['常见体验','晚上决定明天不玩手机；第二天躺到床上，手机已经在手里，中间没有完整决定。'],['研究意义','日常大量行为在相似情境中重复发生。目标已经变了，行为系统可能还停在旧版本。'],['转折','计划再好，如果旧情境不断启动旧动作，也很难稳定改变。']],n:'目标已经更新到 V2.0，行为系统可能还在运行 V1.0。'},
{e:'经典实验',t:'电影院里的“陈爆米花”：场景比喜欢不喜欢更强',pop:true,c:[['研究问题','人吃爆米花，是因为喜欢，还是因为电影院情境已经自动触发吃爆米花？'],['实验设计','在电影院给观众爆米花，有些新鲜，有些不新鲜，并区分强习惯者和弱习惯者。'],['强/弱习惯','弱习惯者平时不太在电影院吃爆米花；强习惯者过去经常边看片边吃。'],['结果差异','弱习惯者不好吃就少吃；强习惯者即使拿到不新鲜爆米花，在熟悉电影院情境中仍更容易继续吃。'],['为什么重要','行为不总是由“我现在想不想要”控制。强习惯更像：情境出现 → 行为先启动。'],['迁移日常','上床→手机；工作卡住→微信；看电视→零食；回家→躺下。很多行为是场景替我们先启动了。']],n:'习惯绑定的往往不是“我有多喜欢”，而是“我过去在这个场景里反复做过什么”。'},
{e:'习惯机制',t:'一个行为怎样从“我要做”变成“自然就做”？',c:[['📍 情境','稳定时间、地点、前一个动作会成为“这里该做什么”的提示。'],['⚙ 行为','在这个场景里反复做一个动作；越小越容易启动。'],['🎁 奖励','快乐、放松、完成感，甚至逃避压力，都可能让行为更容易重复。'],['🔁 重复','重点不是神奇的 21 天，而是相同线索下重复了多少次。'],['🚀 自动化','最后不需要每次重新说服自己。到点就开始，场景一出现行为就启动。'],['坏习惯为什么容易','短视频、拖延、零食通常有即时奖励；学习和运动的收益往往延迟。']],n:'习惯不是意志力失败，而是情境、行为、奖励和重复长期连在一起。'},
{e:'环境设计',t:'摩擦力：比“我要更自律”更有用的问题',c:[['降低好行为摩擦','书提前翻开，运动鞋放门口，第一步缩到 5 分钟，固定时间地点，完成后看得见进度。'],['增加坏行为摩擦','手机离开工作区，关闭通知，退出账号，零食移出视线，让游戏入口多一步。'],['负强化','拖延有时不是因为好玩，而是因为逃开难题能立刻让焦虑下降。'],['真正高级的自律','不是每天更痛苦地忍，而是让正确行为更容易发生，让错误行为不那么顺手。'],['和 WOOP 的连接','WOOP 负责提前设计障碍出现时做什么；环境负责让这个动作更容易真的发生。']],n:'环境不是背景板；环境一直在告诉你下一步最容易做什么。'},
{e:'习惯中断',t:'环境变化为什么反而是改变习惯的好时机？',c:[['Habit Discontinuity','旧习惯依赖稳定线索。当线索被打断，旧自动化会暂时失效。'],['变化窗口','搬家、换学校、换工位、换作息都会打断旧路线，也给新习惯留下空间。'],['例子','以前回家就躺床看手机；如果换成进门先坐书桌并完成固定小动作，旧链条被打断。'],['为什么重要','环境改变虽然麻烦，但它让过去的“自动启动”不再那么顺滑。'],['实践启发','不要只等自己意志力变强，抓住场景变化重新设计第一步。']],n:'改变习惯的机会，常常出现在生活结构被打乱的时候。'},
{e:'第四本书｜叙事身份',t:'McAdams：人不仅经历人生，还会把人生讲成一个故事',profile:'McAdams',c:[['作者与概念','Narrative identity：成年人会把重构过的过去、现在的处境和想象中的未来组织成一个连续故事。'],['不是流水账','人生故事不是全部记录，而是选择哪些事实重要、它们说明什么、我因此成为谁。'],['同一事实，两种故事','项目失败。故事 A：证明我不适合。故事 B：暴露我缺销售和现金流能力。'],['为什么重要','事实相近，意义不同；意义不同，下一步也不同。'],['与前三本关系','前三本谈愿景、障碍、行动和习惯；McAdams 追问这些经历最后如何进入“我是谁”。']],n:'我们不仅活在发生过的事情里，也活在“这些事情说明了什么”的故事里。'},
{e:'人生故事结构',t:'人生故事不是流水账，它会挑选“有意义的场景”',c:[['🎬 关键场景','高峰、低谷、转折点、早期记忆。它们常被用来回答“我是谁”。'],['🧭 Agency 主体性','故事里的我能不能做选择、影响生活、完成事情？'],['🤝 Communion 联结','故事里的我和别人是什么关系？包括爱、朋友、家庭、归属和帮助。'],['🎚 Narrative Tone','故事底色：世界总体安全还是危险？好事能否持续？别人是否值得信任？'],['🧠 Ideological Setting','我认为什么值得追求：自由、责任、家庭、创造、成就、稳定、帮助别人。'],['为什么要讲这些','同一件事放进不同底色、价值和关系里，会变成不同人生故事。']],n:'人生故事不是事实堆叠，而是事实、情绪、价值和未来想象的组织方式。'},
{e:'具体故事',t:'一个小场景如何变成身份：答错题被笑',c:[['📷 事件','课堂上答错题，同学笑了。摄像机能拍到的事实只是：答错了，有人笑。'],['😳 当时情绪','羞耻、尴尬、想躲起来。情绪是真的，但情绪不等于永久结论。'],['💬 后来解释','“公开表达很危险。” 这个解释可能在之后很多场景里继续运行。'],['🪞 身份判断','“我不是善于表达的人。” 一次场景被扩展成关于整个人的定义。'],['🚶 行为后果','避免举手和发言，练习越来越少，表达确实越来越弱，旧故事得到“证据”。'],['另一种解释','那次经历很难受，也说明我当时没有准备好、很在意评价；但不等于我永久不适合表达。']],n:'重写故事不是否认事实，而是不让一次场景吞掉整个人。'},
{e:'事实与身份',t:'“我就是这样的人”，通常不是事实，而是推理的终点',c:[['四步链条','事件 → 意义解释 → 身份判断 → 后续行为。很多人直接从事件跳到身份。'],['数学失分','事实：4 道计算题错。过快解释：我就是粗心。更完整解释：检查流程还没有形成具体步骤。'],['项目中断','事实：做到一半停。过快解释：我没执行力。更完整解释：范围太大、反馈不足、环境支持不够。'],['表达卡壳','事实：一次表达中途卡住。过快解释：我不适合表达。更完整解释：练习情境少，准备方式不够具体。'],['关键句','“我是这样的人”很难改变；“我有这样一种模式”就可以设计。']],n:'不改变事实，改变因果解释；不否认问题，把问题从身份还原成模式。'},
{e:'故事模式',t:'Redemption、Contamination 与 Generativity',c:[['🌱 Redemption 救赎叙事','坏事仍然是坏事，但后来从中长出能力、关系或方向。项目失败 → 学会商业验证。'],['🕳 Contamination 污染叙事','一次坏事把后面所有好事都染黑。项目失败 → 我的人生总是失败。'],['🧬 Generativity 创生性','成年以后故事会问：我能留下些什么？教会别人能力、养育孩子、做有用产品、建立团队。'],['和显化的关系','初级显化问“我要得到什么”；身份层会问“得到这些后，我想成为什么样的人？”'],['为什么放在这里','它把个人改变从“得到结果”升级为“创造意义”。']],n:'真正稳定的改变，不只是结果变了，也包括人对自己和未来的故事变了。'},
{e:'总模型',t:'四本书放在一起：完整改变路径是一个循环',c:[['✨ 未来图景｜Shinn','我想去哪？让未来先有一个心理位置，停止用旧语言预演失败。'],['🧱 现实障碍｜Oettingen','什么挡住我？把愿景和现实放在一起，找到真正的行动入口。'],['🪜 行为计划｜WOOP','障碍出现时我怎么做？用 If–Then 把失败瞬间提前设计。'],['🌍 环境设计｜Wood','怎样让正确行为更容易？降低好行为摩擦，增加坏行为摩擦。'],['🔁 重复与习惯','在稳定情境中重复，获得即时反馈，让行动从努力变成自动。'],['✅ 真实证据','我真的做到了什么？积累可观察证据，而不是只说我是某种人。'],['📖 身份更新｜McAdams','这些证据说明我正在成为谁？把新经验写进自我故事。'],['✨ 新未来图景','身份更新后，人能想象新的未来，于是循环再次开始。']],n:'稳定改变不是先相信自己已经是某种人，而是允许新可能 → 行动 → 获得证据 → 更新故事。'},
{e:'成人案例',t:'完整案例：一个人想学会独立完成一个产品',c:[['未来图景','能独立完成并上线一个真实产品，有真实用户使用。愿望不是“我想变厉害”，而是一个可观察产出。'],['现实障碍','一遇技术难点就切换新想法，导致没有一个版本真正上线。'],['WOOP 计划','如果遇到技术卡点，就先缩小范围，保留最小闭环，而不是换项目。'],['环境设计','每天固定 30 分钟；打开电脑第一步只做 5 分钟任务；手机不放工作区；新想法只记到列表。'],['旧身份故事','“我很多年没写代码了，已经不是能独立开发的人。” 技术困难被解释成身份失败。'],['新身份故事','“我曾有开发能力，现在是在重建端到端能力。” 技术问题说明当前需要学习。']],n:'成年人做长期目标，也会遇到同样的愿景、障碍、习惯和身份问题。'},
{e:'学生案例',t:'如果目标换成“数学更稳定”，这套模型怎么用？',c:[['未来图景','遇到难题不慌，会做的题稳定拿分，不会的题也能多坚持几分钟。'],['现实障碍','卡 3 分钟就想看答案，或给自己贴标签：“我数学不行”。真正障碍是过早退出。'],['If–Then 计划','如果卡住，就先写已知条件、目标和能推出的第一步；仍不会，再看提示。'],['环境设计','答案册放远；草稿纸提前准备；同类题固定使用“圈条件—写目标—列关系”的流程。'],['真实证据','一周内有 6 道题是自己多坚持后做出来的。这不是口号，而是新证据。'],['身份更新','也许我不是“数学不行”，而是过去太早退出。新的故事不是夸大，而是更准确。']],n:'这页不要求任何人现场改变，只是展示机制怎样在普通学习场景中运行。'},
{e:'最终区分',t:'所以“显化”到底是什么？三个版本必须分开',c:[['玄学版','思想直接召唤现实。问题是因果机制不可验证，也容易把不幸归咎于个人信念。'],['简单励志版','相信 + 努力就行。问题是太粗糙，忽略障碍、环境、习惯和身份故事。'],['整合版本','未来图景改变注意力和期待；现实对照识别障碍；计划和环境改变行为；重复形成习惯；真实证据更新身份。'],['四本书留下的拼图','Shinn：先看见未来。Oettingen：再看清障碍。Wood：让正确行为变容易。McAdams：用真实证据更新故事。'],['最后一句','愿望不会直接改变世界，但它会改变你看见什么、怎样解释、愿意尝试什么，以及重复什么。']],n:'愿望不是魔法，但它可能是改变现实互动方式的起点。'}
];let current=0;function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function gridClass(n){return 'grid '+(n<=2?'c2':n===3?'c3':n===4?'c4':n<=6?'c3':'c4')+(n>=7?' dense':n>=5?' medium':'')}function card(x){return `<div class="card"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`}function renderHero(s,i){let path=['✨ 我想成为怎样？','🧱 现实卡在哪里？','⚙️ 我真正做了什么？','🔁 什么开始变成习惯？','📖 我怎样解释自己？'];return `<section class="slide"><div class="head"><div class="eyebrow">${s.e}</div><div class="page">${i+1} / ${slides.length}</div></div><div class="body"><div class="hero"><div><h2>从“显化”到习惯</h2><p>愿望是怎么影响现实的？从 4 本书，看一个想法怎样经过想象、障碍、行动、习惯与身份，最终影响人的生活轨迹。</p><div class="books"><span class="book">Shinn</span><span class="book">Oettingen</span><span class="book">Wendy Wood</span><span class="book">McAdams</span></div></div><div class="steps">${path.map(p=>`<div class="step">${p}</div>`).join('')}</div></div></div><div class="note">${s.n}</div></section>`}function renderPop(s,i){return `<section class="slide"><div class="head"><div class="eyebrow">${s.e}</div><div class="page">${i+1} / ${slides.length}</div></div><h1>${esc(s.t)}</h1><div class="body"><div class="pop"><div class="cinema"><div><b style="font-size:22px">🎬 实验场景</b><div class="screen" style="margin-top:16px">CINEMA</div></div><div class="popcorns"><span>🍿</span><span>🍿</span><span>🍿</span></div><div class="mini">电影院、座位、电影开始、手里有爆米花——熟悉情境本身就是行为线索。</div></div><div class="grid c2 medium">${s.c.slice(0,4).map(card).join('')}</div><div class="grid c2 medium">${s.c.slice(4).map(card).join('')}</div></div></div><div class="note">${s.n}</div></section>`}function renderGeneric(s,i){if(s.profile){let first=s.c[0];let rest=s.c.slice(1);return `<section class="slide"><div class="head"><div class="eyebrow">${s.e}</div><div class="page">${i+1} / ${slides.length}</div></div><h1>${esc(s.t)}</h1><div class="body"><div class="profile"><div class="profilebox"><div class="big">${s.profile}</div><div class="sub">${esc(first[1])}</div></div><div class="${gridClass(rest.length)}">${rest.map(card).join('')}</div></div></div><div class="note">${s.n}</div></section>`}return `<section class="slide"><div class="head"><div class="eyebrow">${s.e}</div><div class="page">${i+1} / ${slides.length}</div></div><h1>${esc(s.t)}</h1><div class="body"><div class="${gridClass(s.c.length)}">${s.c.map(card).join('')}</div></div><div class="note">${s.n}</div></section>`}document.getElementById('deck').innerHTML=slides.map((s,i)=>s.hero?renderHero(s,i):s.pop?renderPop(s,i):renderGeneric(s,i)).join('');function show(i){current=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.slide').forEach((el,idx)=>el.classList.toggle('active',idx===current));document.querySelector('.bar').style.width=((current+1)/slides.length*100)+'%';history.replaceState(null,'','#s'+(current+1))}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}});let m=location.hash.match(/s(\d+)/);show(m?parseInt(m[1])-1:0);</script></body></html>
