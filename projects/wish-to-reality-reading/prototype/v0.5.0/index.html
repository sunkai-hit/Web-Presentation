d-template-columns:repeat(5,1fr)}.main-side{grid-template-columns:1.2fr .8fr}.side-main{grid-template-columns:.78fr 1.22fr}.card,.node,.mini{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:15px 16px;box-shadow:0 8px 22px rgba(55,48,34,.05)}.blue{background:var(--b)}.green{background:var(--g)}.red{background:var(--r)}.gold{background:var(--y)}h1,h2,h3,h4,p{margin:0}.card h3{font-size:20px;color:var(--blue);margin-bottom:7px}.card h4{font-size:16px;color:var(--blue);margin-bottom:5px}.card p,.card li{font-size:14.2px;line-height:1.5;color:#3d4658}.card ul{margin:6px 0 0;padding-left:18px}.note{background:rgba(255,255,255,.58);border-left:5px solid var(--gold);border-radius:14px;padding:11px 13px;font-size:15.5px;line-height:1.55;color:#344054}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.tag{padding:6px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;color:#40506a;font-weight:800}.hero{height:100%;display:flex;align-items:center;justify-content:center;text-align:center}.big{font-size:58px;color:var(--blue);font-weight:880;letter-spacing:-.03em}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}.vstep{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;text-align:center;min-height:135px}.ico{font-size:28px;margin-bottom:5px}.vstep b,.node b{display:block;color:var(--blue);font-size:16.5px;margin-bottom:4px}.vstep span,.node p,.node .ex,.mini span{font-size:13.2px;line-height:1.42;color:#4e596b}.time{border-top:5px solid var(--gold);min-height:220px}.time h3{font-size:18px}.time p{margin-top:6px}.chapter-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.chapter{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:15px;padding:10px;min-height:130px}.chapter b{display:block;font-size:13.6px;color:var(--blue);margin-bottom:4px}.chapter p{font-size:12.2px;line-height:1.38;color:#4a5568}.flow{display:grid;gap:10px}.node{min-height:172px;display:flex;flex-direction:column;gap:4px}.node small{color:#947e5e;font-size:11.4px;letter-spacing:.08em;font-weight:850;text-transform:uppercase}.node .ex{margin-top:auto;border-top:1px dashed rgba(184,137,69,.45);padding-top:6px}.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mini{padding:10px 11px}.mini b{display:block;color:var(--blue);font-size:14px;margin-bottom:4px}.story{display:grid;grid-template-columns:58px 1fr;gap:12px}.emoji{width:56px;height:56px;border-radius:18px;background:var(--y);display:flex;align-items:center;justify-content:center;font-size:31px}.story h3{font-size:19px;color:var(--red);margin-bottom:6px}.table{display:grid;grid-template-columns:120px 1fr 1fr 1fr;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}.table div{padding:9px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12.8px;line-height:1.38;color:#465164}.table div:nth-child(4n){border-right:0}.head{background:var(--blue);color:#fff!important;font-weight:850}.row{background:#f8f2e7;color:var(--blue)!important;font-weight:850}.identity{display:grid;grid-template-columns:1fr 46px 1fr 46px 1fr 46px 1fr;gap:8px}.arrow{display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:26px;font-weight:900}.chain{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.chain .node{min-height:150px}.quote{font-size:26px;line-height:1.45;font-weight:790;color:var(--blue);text-align:center}.formula{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.chip{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 13px;font-size:14px;color:var(--blue);font-weight:850}.op{font-size:22px;color:var(--gold);font-weight:900}.footer{position:absolute;left:42px;right:42px;bottom:14px;display:flex;justify-content:space-between;color:#907e66;font-size:12px}.progress{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(900px,70vw);height:4px;border-radius:999px;background:rgba(24,34,56,.13);overflow:hidden;z-index:3}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--blue));transition:.25s}.nav{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;z-index:4}.nav button{border:0;background:rgba(24,34,56,.9);color:#fff;border-radius:999px;padding:10px 13px;font-weight:800;cursor:pointer}@media(max-width:1050px){.slide{padding:24px 28px 42px}.t{font-size:31px}.s{font-size:16px}.main-side,.side-main,.g2{grid-template-columns:1fr}.g3,.g4,.g5,.steps,.chapter-grid,.chain{grid-template-columns:1fr 1fr}.identity{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.nav{display:none}.footer{left:28px;right:28px}}</style></head><body><div class="deck" id="deck"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="nav"><button id="prev">← 上一页</button><button id="next">下一页 →</button></div><script>
const slides=[
{ k:'四本书，四种解释', t:'从“显化”到习惯', s:'愿望是怎么影响现实的？', hero:`<div><div class="steps"><div class="vstep"><div class="ico">✨</div><b>想象未来</b><span>显化传统最有力量的部分：先允许另一种可能出现。</span></div><div class="vstep"><div class="ico">🧱</div><b>看见障碍</b><span>愿望不碰到现实，就容易只停在幻想里。</span></div><div class="vstep"><div class="ico">🔁</div><b>形成习惯</b><span>真正改变生活的，往往是重复到自动化的行为。</span></div><div class="vstep"><div class="ico">📖</div><b>更新故事</b><span>真实证据进入“我是谁”的叙事。</span></div></div><div class="note" style="margin-top:26px">这不是“成功学秘籍”，而是用四本书看清一条路径：一个愿望怎样从脑中的想法，逐步进入行动、习惯和身份。</div></div>`},
{ k:'开场：一个流行词', t:'“显化”为什么会吸引人？', s:'Manifestation 常被理解为：通过想象、信念、肯定语和情绪状态，让想要的结果进入现实。它真正打动人的地方，是让人从现状中抬头，看见另一种可能。', body:`<div class="body g3"><div class="card gold"><h3>✨ 网上常见版本</h3><p>“想象自己已经拥有”“每天说肯定语”“相信宇宙会回应”。这种版本简单、直接、有希望感。</p><div class="tags"><span class="tag">Visualization</span><span class="tag">Affirmation</span><span class="tag">Law of Attraction</span></div></div><div class="card blue"><h3>🧠 心理学版本</h3><p>未来图景会改变人的注意力、期待、情绪和解释方式。你开始看见相关线索，也更愿意为某种结果准备。</p><div class="mini"><b>关键转译</b><span>不是“想法直接控制现实”，而是“想法改变人怎么进入现实”。</span></div></div><div class="card green"><h3>🛠 行为科学版本</h3><p>只有当愿望进入计划、行动、环境和习惯，它才可能稳定改变结果。否则它只是一个让人舒服的画面。</p><div class="mini"><b>核心问题</b><span>愿望之后，发生了什么？这正是后面四本书的主线。</span></div></div></div><div class="note">这份讲义不急着判断“显化是真是假”，而是拆开看：愿望如何改变注意力，注意力如何引出行动，行动如何变成习惯，习惯如何改写自我故事。</div>`},
{ k:'路线图', t:'四本书像四个不同焦距的镜头', s:'它们不是彼此无关的读书笔记，而是一步步把“愿望影响现实”这件事，从灵性语言拉回到心理学、行为科学和身份叙事。', body:`<div class="body g4"><div class="card time gold"><h3>📘 Shinn｜内在图景</h3><p><b>书：</b>《The Game of Life》</p><p><b>她在问：</b>如果人一直用失败、匮乏和恐惧描述自己，会怎样影响生活？</p><p><b>贡献：</b>愿望、语言、想象、放下、直觉。</p></div><div class="card time blue"><h3>📗 Oettingen｜愿望与障碍</h3><p><b>书：</b>《Rethinking Positive Thinking》</p><p><b>她在问：</b>为什么只幻想成功，有时反而降低行动力？</p><p><b>贡献：</b>心理对照、WOOP、If–Then。</p></div><div class="card time green"><h3>📙 Wood｜行为自动化</h3><p><b>书：</b>《Good Habits, Bad Habits》</p><p><b>她在问：</b>为什么明明知道该做什么，还是回到旧行为？</p><p><b>贡献：</b>情境、摩擦力、奖励、重复。</p></div><div class="card time red"><h3>📕 McAdams｜自我故事</h3><p><b>书：</b>《The Stories We Live By》</p><p><b>他在问：</b>为什么一次经历会被解释成“我就是这样的人”？</p><p><b>贡献：</b>叙事身份、意义、救赎与污染叙事。</p></div></div><div class="formula"><span class="chip">未来图景</span><span class="op">→</span><span class="chip">现实障碍</span><span class="op">→</span><span class="chip">行为系统</span><span class="op">→</span><span class="chip">自我故事</span></div>`},
{ k:'第一本书：作者和背景', t:'Florence Scovel Shinn：一百年前的“显化”传统', s:'《The Game of Life》出版于 1925 年，属于美国新思想运动的自助传统。它不是严格科学，却抓住了一个真实问题：人怎样被自己的语言和想象限制。', body:`<div class="body side-main"><div class="card gold"><h3>📘 背景卡</h3><p><b>时代：</b>20 世纪初，美国流行“思想影响人生”的自助观念。</p><p><b>风格：</b>故事、宗教化表达、肯定语与潜意识。</p><p><b>局限：</b>会把一些外部事件解释得过于唯心。</p><div class="tags"><span class="tag">New Thought</span><span class="tag">1925</span><span class="tag">自助经典</span></div></div><div class="grid g2"><div class="card blue"><h3>她真正想解决的问题</h3><p>很多人嘴上想改变，内在却重复相反图像：害怕失败、担心失去、觉得自己不配、认定机会不会来。</p><p>Shinn 试图让人先从内在语言中松绑。</p></div><div class="card green"><h3>今天怎么读更合适？</h3><p>不要照字面相信“思想直接创造现实”。更好的读法是：长期语言和想象会改变人对机会、风险和自己的判断。</p><p>它的价值在“心理状态如何影响行动方式”。</p></div></div></div><div class="note">一句话：Shinn 给我们的不是科学证明，而是一个重要提醒——人常常先被自己脑中的未来图景改变。</div>`},
{ k:'章节图：第一本书', t:'十章不是零散金句，而是一条“内在整理”路线', s:'这本书从“人生是什么”讲到金钱、语言、关系、直觉和人生方向。每章都在处理一种内在阻塞。', body:`<div class="chapter-grid"><div class="chapter"><b>01 游戏</b><p>把人生从“战斗”换成“有规则的互动”。核心是：你发出的语言、态度和行为会形成回流。</p></div><div class="chapter"><b>02 丰盛法则</b><p>匮乏感不只是情绪，也会让人看不见资源、害怕接收。</p></div><div class="chapter"><b>03 语言的力量</b><p>反复说出口的话，会慢慢成为默认预期。语言像在给潜意识写脚本。</p></div><div class="chapter"><b>04 不抗拒</b><p>越把注意力交给恐惧，恐惧越占据全部空间。目标是停止和问题纠缠。</p></div><div class="chapter"><b>05 宽恕</b><p>宽恕不是说对方没错，而是停止让旧冲突继续消耗当下。</p></div><div class="chapter"><b>06 卸下重担</b><p>做完可控部分后，放下对不可控部分的强迫性焦虑。</p></div><div class="chapter"><b>07 爱</b><p>区分爱、占有和恐惧。爱不是控制某个人按我希望的方式回应。</p></div><div class="chapter"><b>08 直觉</b><p>不要求一次知道全程，只寻找下一步。直觉在书中是行动线索。</p></div><div class="chapter"><b>09 神圣设计</b><p>从“小愿望”转向“适合我的位置”。真正成功不只是赢，而是对位。</p></div><div class="chapter"><b>10 肯定语</b><p>先识别旧信念，再用新语言替换它。全书最后落到日常表达。</p></div></div><div class="note">这页要讲出的核心：Shinn 的“显化”至少包含愿望、语言、放下、关系、直觉、行动，不是单纯“闭眼想一想”。</div>`},
{ k:'机制图：Shinn', t:'从愿望到结果：Shinn 认为中间发生了什么？', s:'下面每个节点都不是装饰词，而是一个可以讲清楚的心理动作。', body:`<div class="flow g4"><div class="node"><div class="ico">🎯</div><small>Step 01</small><b>愿望｜确定方向</b><p>先分清自己真正想要什么，而不是只盯着单一路径。</p><div class="ex">例：“我想变好”→“遇到难题时不马上放弃”。</div></div><div class="node"><div class="ico">🖼</div><small>Step 02</small><b>想象｜建立画面</b><p>让脑中出现“已经实现后的状态”，把目标从文字变成可以感到的场景。</p><div class="ex">例：看见自己稳定完成一页练习。</div></div><div class="node"><div class="ico">🗣</div><small>Step 03</small><b>语言｜停止拆台</b><p>检查每天反复说什么。Shinn 最重视“话语会变成内在预期”。</p><div class="ex">“我最近失分”不同于“我就是不行”。</div></div><div class="node"><div class="ico">🧠</div><small>Step 04</small><b>期待｜形成预设</b><p>语言和画面重复久了，会成为默认期待：我是在等待机会，还是等待失败？</p><div class="ex">期待影响你靠近还是退缩。</div></div></div><div class="flow g4" style="margin-top:10px"><div class="node"><div class="ico">🧘</div><small>Step 05</small><b>放下｜减少内耗</b><p>不是不在乎，而是不再把全部注意力放在“为什么还没发生”。</p><div class="ex">做完准备后，停止反复确认结果。</div></div><div class="node"><div class="ico">🔍</div><small>Step 06</small><b>指引｜寻找下一步</b><p>留意下一步线索：念头、邀请、信息、机会，或一个可以先试的小动作。</p><div class="ex">不是整张地图，而是下一步。</div></div><div class="node"><div class="ico">🚶</div><small>Step 07</small><b>行动｜接住机会</b><p>机会出现时要真正行动。没有行动，显化很容易退化成幻想。</p><div class="ex">联系、报名、申请、开始。</div></div><div class="node"><div class="ico">🌍</div><small>Step 08</small><b>结果｜反馈循环</b><p>作者说“显现”；现代版本是心理图景通过行为改变现实反馈。</p><div class="ex">你以新的方式进入同一个问题。</div></div></div>`},
{ k:'故事：新公寓与新地毯', t:'“先买地毯”的故事，到底该怎么理解？', s:'这是全书很典型的显化故事：表面像神奇事件，真正有价值的是“准备动作”如何改变一个人的状态。', body:`<div class="body main-side"><div class="card gold"><div class="story"><div class="emoji">🏠</div><div><h3>故事本身</h3><p>住房紧缺时，一个女人想搬进新公寓。周围人都说很难，她却先买了一张适合新家的地毯，好像那件事已经在路上。后来公寓机会真的出现。</p></div></div><div class="mini-grid" style="margin-top:12px"><div class="mini"><b>1 无望状态</b><span>“根本找不到房子。”</span></div><div class="mini"><b>2 目标画面</b><span>“我会有新的住处。”</span></div><div class="mini"><b>3 准备动作</b><span>买地毯，给结果留位置。</span></div><div class="mini"><b>4 机会识别</b><span>更愿意询问、行动、接收机会。</span></div></div></div><div class="card blue"><h3>两种读法</h3><p><b>字面读法：</b>买地毯召唤了公寓。</p><p><b>更稳妥读法：</b>地毯不是魔法，而是心理和行动状态的改变信号。</p><div class="note" style="margin-top:12px">这个故事最该留下的是：相信并不只是心里想，而是你开始做一些与结果一致的准备。</div></div></div>`},
{ k:'故事：3000 美元与语言', t:'目标可以明确，但路径不要锁死', s:'Shinn 的故事常常提醒：你可以清楚知道自己要什么，但不要规定它必须从唯一的人、唯一的方式、唯一的时间出现。', body:`<div class="body g3"><div class="card blue"><h3>💵 3000 美元故事</h3><p>一位女士急需 3000 美元。她最初只盯着“钱从哪里来”，并且预设了几个有限渠道。Shinn 鼓励她把重点放在“正确的帮助会出现”，而不是锁死方式。</p></div><div class="card gold"><h3>🧭 Shinn 想表达</h3><p>愿望要清楚，但路径要开放。她常用类似“这个，或者更好的”来提醒人：不要把真实目标误认成某个固定渠道。</p><div class="mini-grid"><div class="mini"><b>目标</b><span>解决财务困境。</span></div><div class="mini"><b>路径</b><span>借钱、机会、项目、帮助、补偿……</span></div></div></div><div class="card green"><h3>🧠 现代解释</h3><p>不锁死路径，会让人更容易发现替代方案。心理上从“只有一种办法”变成“我可以寻找多种通道”。</p><div class="note" style="margin-top:10px">锁死路径会缩窄注意力；开放路径会扩大搜索范围。</div></div></div><div class="note">第一本书的价值很清楚：愿望、语言、想象和放下控制能改变人进入现实的方式。但第二本书会问：积极想象一定会让人行动吗？</div>`},
{ k:'第二本书：作者与问题', t:'Oettingen：她不是反对积极，而是反对停在积极', s:'《Rethinking Positive Thinking》研究一个反常识现象：美好幻想会让人短期感觉更好，但不一定让人更努力。', body:`<div class="body side-main"><div class="card blue"><h3>📗 背景卡</h3><p><b>作者：</b>Gabriele Oettingen，心理学家，长期研究未来思维、动机和目标达成。</p><p><b>核心问题：</b>人们想象未来时，什么情况下会真正行动？什么情况下只是获得心理满足？</p><div class="tags"><span class="tag">Motivation</span><span class="tag">Mental Contrasting</span><span class="tag">WOOP</span></div></div><div class="grid g2"><div class="card gold"><h3>积极幻想的好处</h3><p>它帮助人发现自己真正想要什么，也能在短期内缓解焦虑，让目标变得有吸引力。没有愿景，人只会困在眼前。</p></div><div class="card red"><h3>积极幻想的问题</h3><p>如果只沉浸在“成功后多美好”，大脑可能提前获得满足感。现实还没变，行动张力却先下降。</p></div></div></div><div class="note">Oettingen 的转折是：未来图景要保留，但必须马上和现实障碍相遇。</div>`},
{ k:'心理对照', t:'只看未来不够，只看困难也不够', s:'Mental Contrasting 的关键，是把想要的未来和当前最真实的障碍放在同一张心理画面里。', body:`<div class="identity"><div class="node gold"><div class="ico">🌟</div><b>未来</b><p>先认真看见你想要的结果，以及它为什么重要。</p><div class="ex">例：三个月后能稳定阅读英文短文。</div></div><div class="arrow">⇄</div><div class="node red"><div class="ico">🧱</div><b>现实障碍</b><p>回到当前：真正挡住我的是什么？尤其是我自己的反应模式。</p><div class="ex">例：一看到生词多，就先想逃开。</div></div><div class="arrow">→</div><div class="node blue"><div class="ico">⚡</div><b>行动张力</b><p>未来和现实一对照，就出现“我要跨过什么”的清晰感。</p><div class="ex">问题不再是“我要努力”，而是“遇到生词多时怎么办”。</div></div><div class="arrow">→</div><div class="node green"><div class="ico">🛠</div><b>具体动作</b><p>把障碍转成预案。障碍不是坏消息，而是下一步设计的材料。</p><div class="ex">先读第一段，标出三个关键词。</div></div></div><div class="grid g3" style="margin-top:12px"><div class="card"><h3>学习例子</h3><p>不是“我数学差”，而是“一看到压轴题就立刻想放弃”。</p></div><div class="card"><h3>项目例子</h3><p>不是“我没有执行力”，而是“遇到技术卡点就切换新项目”。</p></div><div class="card"><h3>运动例子</h3><p>不是“我不自律”，而是“下班累了以后没有最小启动动作”。</p></div></div><div class="note">一句话：障碍不是负能量，障碍是信息。</div>`},
{ k:'WOOP 四步', t:'WOOP 的每一步，都在完成一个不同任务', s:'它不是简单口号，而是一套把愿望转成行动的心理结构。', body:`<div class="flow g4"><div class="node gold"><div class="ico">🎯</div><small>W · Wish</small><b>愿望｜确定方向</b><p>选择一个有意义、但基本可行的目标。太模糊或太不现实，都不容易行动。</p><div class="ex">“每周读三次英文短文”比“英语变好”更可操作。</div></div><div class="node blue"><div class="ico">🌟</div><small>O · Outcome</small><b>结果｜提供吸引力</b><p>想象最好的结果，确认这件事为什么值得。它让目标带有情感重量。</p><div class="ex">读题不慌、文章能读下去、感觉自己在进步。</div></div><div class="node red"><div class="ico">🧱</div><small>O · Obstacle</small><b>障碍｜找到卡点</b><p>重点找内部障碍：恐惧、拖延、逃避、完美主义、容易分心。</p><div class="ex">“没时间”往下拆，可能是“一有空就先拿手机”。</div></div><div class="node green"><div class="ico">🪜</div><small>P · Plan</small><b>计划｜预设反应</b><p>写成 If–Then，把障碍与行动绑定。等障碍出现时，不再临时纠结。</p><div class="ex">如果想逃开，就先做 5 分钟最小动作。</div></div></div><div class="card" style="margin-top:12px"><h3>完整案例：英语阅读</h3><p><b>Wish：</b>每周读 3 次英文短文。　<b>Outcome：</b>读文章更稳，看到生词不那么慌。　<b>Obstacle：</b>一看到生词多，就觉得麻烦，想先做别的。　<b>Plan：</b>如果生词很多，我先只读第一段，并标出 3 个关键词。</p></div>`},
{ k:'第二本书的目的', t:'WOOP 不只是让你坚持，也会帮你判断是否值得继续', s:'这让它比普通励志方法更成熟：它不承诺“所有愿望都能实现”，而是让人更聪明地分配努力。', body:`<div class="body g2"><div class="card green"><h3>✅ 目标可行时</h3><p>心理对照让未来和障碍绑定，行动会更聚焦。你会更清楚：不是“我要努力”，而是“我在这个情境下要做这个动作”。</p><ul><li>愿景提供方向</li><li>障碍提供切入口</li><li>计划降低临场决策成本</li></ul></div><div class="card red"><h3>⚠ 目标不现实或不值得时</h3><p>心理对照也可能让你看清：当前目标太大、路径不合适，或者投入产出不值得。调整、缩小或放下，也是一种理性。</p><ul><li>不是每个目标都要死磕</li><li>放弃不等于失败</li><li>成熟包括重新选择</li></ul></div></div><div class="note">第二本书把“显化”推进到：愿景 + 障碍 + 计划。但第三本书继续追问：计划明明很好，为什么现实中还是经常做不到？</div>`},
{ k:'第三本书：习惯科学', t:'Wendy Wood：很多日常行为，不是每次重新决定', s:'《Good Habits, Bad Habits》把问题从“有没有意志力”转到“情境如何触发行为”。', body:`<div class="body main-side"><div class="grid g2"><div class="card blue"><h3>🧠 目标系统</h3><p>它问：“我现在想做什么？”需要意识、判断和选择。优点是灵活，缺点是会疲劳、会受情绪影响。</p><div class="mini"><b>例</b><span>我决定今晚学习 30 分钟。</span></div></div><div class="card gold"><h3>🔁 习惯系统</h3><p>它问：“我以前在这个场景下一般做什么？”更快、更省力，也更容易在没注意时接管行动。</p><div class="mini"><b>例</b><span>一上床，手自然去摸手机。</span></div></div></div><div class="card green"><h3>为什么这解释了“知道但做不到”</h3><p>一个人可以在白天决定“今晚要学习”，但晚上回到熟悉场景时，旧习惯链条已经准备好了。</p><p style="margin-top:8px">所以很多改变失败，并不是愿望不真，而是新目标被塞进了完全没变的旧环境。</p><div class="note" style="margin-top:10px">目标已经升级到 V2.0，行为系统还运行着 V1.0。</div></div></div>`},
{ k:'经典实验', t:'电影院里的“陈爆米花”：情境比喜欢不喜欢更强', s:'这个实验特别适合说明：强习惯会让环境线索直接触发行为，而不是每次都先问“我真的想不想”。', body:`<div class="body main-side"><div class="card gold"><div class="story"><div class="emoji">🍿</div><div><h3>实验流程</h3><p>观众进入电影院后拿到爆米花，其中一些并不新鲜。研究者观察不同人吃多少。</p></div></div><div class="mini-grid" style="margin-top:12px"><div class="mini"><b>A：弱习惯</b><span>不新鲜 → 觉得不好吃 → 明显少吃。</span></div><div class="mini"><b>B：强习惯</b><span>电影院情境 → 自动吃 → 味道变差也继续。</span></div></div><p style="font-size:14px;line-height:1.5;color:#3d4658;margin-top:10px">如果只是“喜欢好吃的爆米花”，那不新鲜时应该停下。但强习惯的人没有完全停下，说明情境本身在推着行为发生。</p></div><div class="grid"><div class="card blue"><h3>迁移到日常</h3><ul><li>🛏 上床 → 拿手机</li><li>💻 工作卡住 → 打开微信</li><li>📺 看电视 → 找零食</li><li>🚪 回家 → 躺下</li></ul></div><div class="card green"><h3>真正的问题</h3><p>不是先骂自己“没自制力”，而是问：这个行为通常在哪个情境自动开始？如果情境不改，旧行为会一直有优势。</p></div></div></div>`},
{ k:'习惯机制图', t:'一个行为怎样从“我要做”变成“自然就做”？', s:'习惯不是神秘力量，而是大脑在稳定情境里学会了“这里通常应该做什么”。', body:`<div class="flow g5"><div class="node"><div class="ico">📍</div><small>01</small><b>情境</b><p>稳定时间、地点、前一个动作，会成为行为线索。</p><div class="ex">例：晚饭后坐到书桌前。</div></div><div class="node"><div class="ico">⚙️</div><small>02</small><b>行为</b><p>在这个场景里做某个动作，最好足够小、容易开始。</p><div class="ex">例：先做 10 分钟题。</div></div><div class="node"><div class="ico">🎁</div><small>03</small><b>奖励</b><p>行为之后得到某种反馈：快乐、轻松、完成感或压力下降。</p><div class="ex">坏习惯常赢在奖励即时。</div></div><div class="node"><div class="ico">🔁</div><small>04</small><b>重复</b><p>同一线索下不断重复，大脑开始绑定情境和行为。</p><div class="ex">“有空再做”不如“每天同一时段”。</div></div><div class="node"><div class="ico">🚀</div><small>05</small><b>自动化</b><p>线索出现后，行为越来越不需要重新说服自己。</p><div class="ex">到点自然开始，而不是每天斗争。</div></div></div><div class="grid g3" style="margin-top:12px"><div class="card red"><h3>为什么短视频容易？</h3><p>奖励即时、变化多、下一次刺激只差一次滑动。</p></div><div class="card gold"><h3>为什么学习较难？</h3><p>成本即时，收益延迟，前期需要额外设计反馈。</p></div><div class="card green"><h3>设计重点</h3><p>好行为降低摩擦，坏行为增加摩擦，让环境重新分配优势。</p></div></div>`},
{ k:'摩擦力与环境', t:'真正高级的自律，往往是少用一点自律', s:'Wood 的建议不是“更狠一点”，而是让环境替你降低正确行为的启动成本。', body:`<div class="body g2"><div class="card green"><h3>🟢 降低好行为摩擦</h3><ul><li><b>材料提前出现：</b>书放在桌上，练习册提前翻开。</li><li><b>第一步缩小：</b>只读一段、只做一道题、只运动 5 分钟。</li><li><b>固定情境：</b>同一时间、同一地点、同一启动动作。</li><li><b>即时反馈：</b>打勾、进度条、运行结果、完成标记。</li><li><b>减少选择：</b>提前决定做什么，别临时重新规划。</li></ul></div><div class="card red"><h3>🔴 增加坏行为摩擦</h3><ul><li><b>减少线索：</b>关通知，桌面不放手机。</li><li><b>增加步骤：</b>退出账号，移走快捷入口。</li><li><b>改变位置：</b>零食不放手边，手机不放床头。</li><li><b>插入停顿：</b>让手快自动去拿时，多一个需要选择的步骤。</li><li><b>别纯靠忍：</b>旧环境不改，旧行为永远很顺手。</li></ul></div></div><div class="note">第三本书补上的，是前两本缺少的一层：行动不能只存在脑子里，它必须被放进一个更容易发生的环境。</div>`},
{ k:'第四本书：叙事身份', t:'McAdams：人不仅活在现实里，也活在自己讲给自己的故事里', s:'《The Stories We Live By》研究 narrative identity：成年人会把过去经历、现在处境和未来想象组织成一个关于“我是谁”的故事。', body:`<div class="body main-side"><div class="grid g2"><div class="card blue"><h3>📷 事实</h3><p>某件事确实发生了：一次考试没考好、项目做到一半停了、一次表达卡壳。</p><p>事实本身不会自动告诉我们“这说明我是谁”。</p></div><div class="card gold"><h3>💬 解释</h3><p>人会给事实加意义：是方法不对、练习不足、目标太大，还是“我就是不行”？</p><p>不同解释会导向不同下一步。</p></div></div><div class="card red"><h3>📖 身份故事</h3><p>当一种解释反复出现，就会变成“我就是这样的人”。这时一次行为失败会被升级成人格判断。</p><div class="mini-grid" style="margin-top:10px"><div class="mini"><b>旧故事</b><span>我以前失败过，所以我不适合。</span></div><div class="mini"><b>新故事</b><span>以前失败让我知道自己缺什么。</span></div></div></div></div><div class="note">McAdams 补上的，是一个更深层问题：真实行动最终会不会变成新的自我证据？</div>`},
{ k:'叙事身份的组成', t:'人生故事不是流水账，它会挑选“有意义的场景”', s:'一个人记住的不是所有事，而是那些被后来反复用来解释自己的场景。', body:`<div class="body g4"><div class="card gold"><h3>🎬 关键场景</h3><p>高峰、低谷、转折点、早期记忆。这些场景会被用来回答“我为什么是现在这样”。</p><div class="mini"><b>例</b><span>一次公开失误，可能被讲成“我不适合表达”。</span></div></div><div class="card blue"><h3>🧭 Agency</h3><p>主体性：故事中的“我”能不能做选择、影响生活、解决问题？</p><div class="mini"><b>例</b><span>“当时没人帮我，我自己想办法解决。”</span></div></div><div class="card green"><h3>🤝 Communion</h3><p>联结：故事中的“我”和别人是什么关系？爱、友谊、家庭、归属、帮助。</p><div class="mini"><b>例</b><span>“最困难的时候，是朋友让我撑过去。”</span></div></div><div class="card red"><h3>🧠 意义背景</h3><p>同一件事被放进不同价值背景，会变成不同故事：自由、责任、创造、证明自己。</p><div class="mini"><b>关键</b><span>重要的不只是发生了什么，而是后来怎么解释。</span></div></div></div><div class="note"><b>救赎叙事：</b>坏事后来发展出能力或意义。　<b>污染叙事：</b>一个坏事件被解释成“毁掉了一切”。</div>`},
{ k:'事实、解释、身份', t:'“我就是这样的人”，通常不是事实，而是推理的终点', s:'重写故事不是否认事实，而是把“发生了什么”和“这说明我是谁”分开。', body:`<div class="identity"><div class="node gold"><div class="ico">📷</div><b>事件</b><p>摄像机能拍到的事实，不带人格判断。</p><div class="ex">这次数学有 4 道计算题错了。</div></div><div class="arrow">→</div><div class="node blue"><div class="ico">💬</div><b>解释</b><p>我给事实加上的意义：方法、习惯、准备，还是人格标签？</p><div class="ex">“我粗心”可能太快。</div></div><div class="arrow">→</div><div class="node red"><div class="ico">🪞</div><b>身份</b><p>解释反复出现后，变成“我就是这种人”的故事。</p><div class="ex">“我不是稳定可靠的人。”</div></div><div class="arrow">→</div><div class="node green"><div class="ico">🚶</div><b>下一步</b><p>身份故事会影响继续尝试，还是提前退出。</p><div class="ex">觉得能改，才会设计改法。</div></div></div><div class="table" style="margin-top:12px"><div class="head">场景</div><div class="head">事实</div><div class="head">过快解释</div><div class="head">更完整解释</div><div class="row">项目中断</div><div>做到一半停了</div><div>我没执行力</div><div>范围太大，缺少阶段反馈和固定情境</div><div class="row">表达卡壳</div><div>当场说得不顺</div><div>我不适合表达</div><div>准备不足，练习场景太少</div><div class="row">考试失分</div><div>4 道计算题错</div><div>我就是粗心</div><div>检查流程还没有形成稳定习惯</div></div>`},
{ k:'整合模型', t:'四本书放在一起，形成一条完整的改变路径', s:'现在可以把“显化”去掉神秘部分，变成一条现实得多的链条。', body:`<div class="chain"><div class="node gold"><div class="ico">✨</div><b>未来图景</b><p>Shinn：我想去哪？我怎样描述这个未来？</p><div class="ex">愿望、想象、语言。</div></div><div class="node red"><div class="ico">🧱</div><b>现实障碍</b><p>Oettingen：什么挡住我？尤其是我自己的反应模式。</p><div class="ex">心理对照、WOOP。</div></div><div class="node blue"><div class="ico">🪜</div><b>行为计划</b><p>障碍出现时，提前决定我做什么。</p><div class="ex">If X, then Y。</div></div><div class="node green"><div class="ico">🌍</div><b>环境设计</b><p>Wood：怎样让正确行为更容易发生？</p><div class="ex">降低摩擦。</div></div><div class="node green"><div class="ico">🔁</div><b>重复习惯</b><p>在稳定情境中反复做小动作，逐渐自动化。</p><div class="ex">从努力到默认。</div></div><div class="node red"><div class="ico">📖</div><b>身份更新</b><p>McAdams：真实证据进入“我是谁”的故事。</p><div class="ex">新证据，新叙事。</div></div></div><div class="note" style="margin-top:16px">稳定改变不是“先相信自己已经是某种人”，而是：允许新可能 → 做一点符合它的事 → 得到真实证据 → 更新自我故事。</div>`},
{ k:'完整案例', t:'例子：一个人想把阅读坚持下来', s:'用一个普通行为，把四本书的思想真正串起来。', body:`<div class="flow g5"><div class="node gold"><div class="ico">✨</div><small>Shinn</small><b>未来图景</b><p>“我希望自己能稳定读完书，而不是只收藏书单。”</p><div class="ex">把愿望说清楚。</div></div><div class="node red"><div class="ico">🧱</div><small>WOOP</small><b>障碍</b><p>真正挡住他的不是没兴趣，而是一翻开书觉得难，就想刷手机放松。</p><div class="ex">找到内部障碍。</div></div><div class="node blue"><div class="ico">🪜</div><small>If–Then</small><b>计划</b><p>如果想拿手机，我先读完当前这一页，并写一句话摘要。</p><div class="ex">预设下一步。</div></div><div class="node green"><div class="ico">🌍</div><small>Wood</small><b>环境</b><p>书放枕边，手机在客厅充电，书签夹到下一页。</p><div class="ex">降低好行为摩擦。</div></div><div class="node red"><div class="ico">📖</div><small>McAdams</small><b>新故事</b><p>一周后，他不必说“我很自律”，只需要看见：我确实读了五次。</p><div class="ex">真实证据进入身份。</div></div></div><div class="grid g3" style="margin-top:12px"><div class="card"><h3>以前的故事</h3><p>“我坚持不了阅读，我总是三分钟热度。”</p></div><div class="card"><h3>新的证据</h3><p>“我用很小的动作连续启动了几次。”</p></div><div class="card"><h3>新的故事</h3><p>“我正在变成一个能把书慢慢读完的人。”</p></div></div>`},
{ k:'应用到学习', t:'如果目标换成“学习更稳定”，这套模型怎么用？', s:'这里不是布置任务，而是展示：这套理论怎样解释一个很普通的学习问题。', body:`<div class="body g3"><div class="card gold"><h3>1 未来图景</h3><p>不要只说“成绩变好”，而是说清楚变化是什么。</p><p><b>例：</b>遇到中等难题时，不马上看答案，能先坚持分析 5 分钟。</p></div><div class="card red"><h3>2 真实障碍</h3><p>表面是“不会做”，深一层可能是：一碰到难题就紧张，觉得做半天也没用。</p><p><b>障碍不是能力差，而是困难出现时的反应模式。</b></p></div><div class="card blue"><h3>3 If–Then</h3><p>如果一道题 3 分钟没有思路，就先写出已知条件、圈关键词、画关系图，而不是立刻翻答案。</p><p><b>重点：</b>把“卡住”变成启动步骤。</p></div></div><div class="grid g3" style="margin-top:12px"><div class="card green"><h3>4 环境</h3><p>桌上只留一科材料；手机放远；错题本打开；草稿纸固定放在手边。</p></div><div class="card green"><h3>5 习惯</h3><p>每天同一时间做一个小固定动作，例如“先做 2 道题再休息”。</p></div><div class="card red"><h3>6 新故事</h3><p>不是“我数学不行”，而是“我正在练习遇到难题不马上逃开”。</p></div></div>`},
{ k:'再区分一下', t:'这不是玄学版显化，也不是鸡血版努力', s:'读完四本书后，我们可以把几个容易混在一起的说法分开。', body:`<div class="body g3"><div class="card red"><h3>❌ 玄学版</h3><p>“我想到了，所以现实会自动发生。”</p><ul><li>忽略条件和行动</li><li>容易责怪失败者</li><li>容易把别人的自由也当成自己的愿望对象</li></ul></div><div class="card gold"><h3>⚠ 鸡血版</h3><p>“只要努力就行。”</p><ul><li>忽略心理图景</li><li>忽略自动行为</li><li>忽略环境线索</li><li>忽略身份故事</li></ul></div><div class="card green"><h3>✅ 去唯心化版本</h3><p>愿望先改变方向感；方向感改变注意力；注意力帮助发现障碍；计划和环境改变行为；重复形成习惯；证据慢慢改变自我故事。</p><ul><li>更现实</li><li>更可解释</li><li>更可实践</li></ul></div></div><div class="note">这也是这套分享的最终目的：把“显化”从神秘许愿，转化为一套愿景—障碍—行为—习惯—身份的理解框架。</div>`},
{ k:'最后留下什么', t:'四本书各自留下的，不是答案，而是一块拼图', s:'它们合起来，比任何单一本书都完整。', body:`<div class="body g4"><div class="card gold"><h3>✨ Shinn</h3><p>留下“未来图景”的力量。一个人要先允许另一种可能进入脑中，才可能为它调整语言和行动。</p><div class="tags"><span class="tag">愿望</span><span class="tag">语言</span><span class="tag">放下</span></div></div><div class="card blue"><h3>🧱 Oettingen</h3><p>留下“未来必须碰到现实”。只想象好结果不够，还要看清真正阻碍自己的东西。</p><div class="tags"><span class="tag">WOOP</span><span class="tag">障碍</span><span class="tag">If–Then</span></div></div><div class="card green"><h3>🔁 Wood</h3><p>留下“行为要放进环境”。真正能长期改变生活的，常常不是一次决定，而是被设计过的重复。</p><div class="tags"><span class="tag">情境</span><span class="tag">摩擦</span><span class="tag">习惯</span></div></div><div class="card red"><h3>📖 McAdams</h3><p>留下“证据会进入故事”。人不是只在做事，也在不断解释自己是什么样的人。</p><div class="tags"><span class="tag">身份</span><span class="tag">意义</span><span class="tag">故事</span></div></div></div><div class="quote">愿望不会直接改变世界，<br/>但它可能改变你看见什么、怎样解释、愿意尝试什么，以及重复什么。</div>`},
{ k:'结束语', t:'当这些变化持续足够久，现实就可能真的开始不同。', s:'', hero:`<div><p class="quote" style="font-size:34px;max-width:1080px">人先想象一种未来，<br/>然后在现实中发现障碍、设计行动、改变环境、重复行为，<br/>最后用真实证据慢慢改写自己是谁。</p><div class="formula" style="margin-top:30px"><span class="chip">想象未来</span><span class="op">→</span><span class="chip">面对障碍</span><span class="op">→</span><span class="chip">设计行动</span><span class="op">→</span><span class="chip">形成习惯</span><span class="op">→</span><span class="chip">更新故事</span></div></div>`}
];
const deck=document.getElementById('deck');slides.forEach((sl,i)=>{const sec=document.createElement('section');sec.className='slide'+(i===0?' active':'');let main=sl.hero?`<div class="inner hero">${sl.hero}</div>`:`<div class="inner"><div class="top"><div><div class="k">${sl.k}</div><h2 class="t">${sl.t}</h2>${sl.s?`<p class="s">${sl.s}</p>`:''}</div><div class="pg">${String(i+1).padStart(2,'0')} / ${slides.length}</div></div>${sl.body}</div>`;sec.innerHTML=main+`<div class="footer"><span>Wish to Reality · v0.5.0</span><span>${String(i+1).padStart(2,'0')} / ${slides.length}</span></div>`;deck.appendChild(sec)});
const sections=[...document.querySelectorAll('.slide')];let current=0;function show(i){current=Math.max(0,Math.min(sections.length-1,i));sections.forEach((s,idx)=>s.classList.toggle('active',idx===current));document.getElementById('bar').style.width=((current+1)/sections.length*100)+'%';location.hash='s'+(current+1)}function fromHash(){const m=location.hash.match(/s(\d+)/);if(m)show(parseInt(m[1],10)-1);else show(0)}document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(sections.length-1)});window.addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
