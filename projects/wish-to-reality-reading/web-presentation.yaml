project:
  slug: wish-to-reality-reading
  name: 从“显化”到习惯：愿望是怎么影响现实的？
  type: web-presentation
  status: Building
  current_version: v0.5.0
  audience: general-reading

prototype:
  version: v0.5.0
  entry: prototype/v0.5.0/index.html
  format: standalone-html
  viewport: 16:9

style:
  tone: 人文社科读书分享 / 公开课式知识讲解
  keywords:
    - 知识型
    - 故事化
    - 不说教
    - 结构图驱动
    - 案例支撑
    - 节点解释充分
    - icon视觉辅助
  palette:
    background: 米白
    primary: 深蓝
    accent_1: 墨绿
    accent_2: 暗红
    accent_3: 暗金

content:
  books:
    - The Game of Life and How to Play It
    - Rethinking Positive Thinking
    - Good Habits, Bad Habits
    - The Stories We Live By
  narrative: 作者背景 → 问题 → 故事/实验 → 作者目的 → 方法 → 案例 → 整合
  core_model: 未来图景 → 现实障碍 → 行为设计 → 环境习惯 → 真实证据 → 自我故事
  latest_changes:
    - v0.5.0 增加 icon / emoji 视觉元素，降低空白感
    - v0.5.0 强化每页内容密度，使其更接近视觉讲义而非提纲页
    - v0.5.0 加入阅读习惯与学习稳定性两个完整案例
    - v0.5.0 使用单文件 HTML，CSS/JS 内嵌
