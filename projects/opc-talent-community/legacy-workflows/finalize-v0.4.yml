name: Finalize Web Presentation V0.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v0.4-release-final
    paths:
      - '.github/workflows/finalize-v0.4.yml'
      - 'tools/finalize_v04.py'
      - 'prototype/full-v0.4/**'
      - 'design/**'
      - 'spec/**'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V0.4 release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo 'Chrome/Chromium is required for QA rendering.' >&2
            exit 1
          fi

      - name: Build, audit, render Contact Sheet and package
        run: python tools/finalize_v04.py

      - name: Verify release archive
        run: |
          unzip -t 'release/v0.4/数智健康OPC国际人才社区_Web_Presentation_V0.4.zip'
          test -s 'qa/contact-sheet-v0.4.jpg'
          test -s 'release/v0.4/数智健康OPC国际人才社区_Web_Presentation_V0.4.html'
          cat release/v0.4/SHA256SUMS.txt

      - name: Commit generated V0.4 release artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            qa/contact-sheet-v0.4.jpg \
            qa/source-reference-audit-v0.4.json \
            qa/release-build-audit-v0.4.json \
            release/v0.4/README.md \
            release/v0.4/HTML-SHA256.txt \
            release/v0.4/SHA256SUMS.txt \
            'release/v0.4/数智健康OPC国际人才社区_Web_Presentation_V0.4.html' \
            'release/v0.4/数智健康OPC国际人才社区_Web_Presentation_V0.4.zip'
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'release: finalize Web Presentation V0.4 artifacts'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
